// ---------------- main app ----------------
// ---------------- Jira integration helpers ----------------
// Jira Cloud's REST API won't answer authenticated cross-origin requests from
// browser JS (CORS), so direct fetches from this page always fail. The fix is
// a tiny Cloudflare Worker that sits between this page and Jira: the browser
// calls the worker (same-origin as far as CORS is concerned — the worker
// sends back permissive CORS headers), and the worker itself calls Jira's
// /rest/api/3/search/jql server-to-server, where CORS doesn't apply at all.
// This is the same proxy contract used by the companion Jira Roadmap page:
// GET  {JIRA_PROXY_URL}/health                                   -> { status: "ok" }
// GET  {JIRA_PROXY_URL}/jira?jiraBase=&auth=&jql=&fields=&maxResults=&nextPageToken=
//      -> forwards to {jiraBase}/rest/api/3/search/jql with "Authorization: Basic {auth}",
//         returns Jira's raw { issues, nextPageToken } JSON straight through.
const JIRA_PROXY_URL = "https://mastermind.jobseeker3555.workers.dev";

// Jira's Sprint custom field comes back either as an array of sprint objects
// ({ id, name, state, ... }) on newer sites, or as an array of stringified
// Java objects on older/classic ones (e.g. "com.atlassian...[id=3,...,
// name=Sprint 12,state=ACTIVE,...]"). This handles both and just keeps the
// most recent sprint in the list (an issue can carry sprint history).
function parseSprintField(raw) {
  if (!raw) return null;
  const arr = Array.isArray(raw) ? raw : [raw];
  if (!arr.length) return null;
  const last = arr[arr.length - 1];
  if (typeof last === "string") {
    const nameMatch = last.match(/name=([^,\]]+)/);
    const stateMatch = last.match(/state=([^,\]]+)/);
    return nameMatch ? { name: nameMatch[1], state: (stateMatch ? stateMatch[1] : "unknown").toLowerCase() } : null;
  }
  if (typeof last === "object" && last.name) {
    return { name: last.name, state: (last.state || "unknown").toLowerCase() };
  }
  return null;
}

// Pulls a "parent" { key, summary } off an issue for the Gantt tree. Prefers
// the standard `parent` field (team-managed projects' native hierarchy);
// falls back to a configurable classic "Epic Link" custom field, which comes
// back as either a bare issue key string or an epic object.
function extractGanttParent(f, parentField) {
  if (f.parent && f.parent.key) {
    return { key: f.parent.key, summary: (f.parent.fields && f.parent.fields.summary) || "" };
  }
  if (parentField && f[parentField]) {
    const v = f[parentField];
    if (typeof v === "string") return { key: v, summary: "" };
    if (v && v.key) return { key: v.key, summary: (v.fields && v.fields.summary) || v.summary || "" };
  }
  return null;
}

function jiraIssueFromApi(iss, fieldMap) {
  const f = iss.fields || {};
  const { pointsField, startDateField, dueDateField, origEndDateField, sprintField, leadingTrackField, parentField } = fieldMap;
  return {
    key: iss.key,
    summary: f.summary || "",
    status: (f.status && f.status.name) || "Unknown",
    statusCategory: (f.status && f.status.statusCategory && f.status.statusCategory.key) || "new", // new | indeterminate | done
    type: (f.issuetype && f.issuetype.name) || null,
    assignee: (f.assignee && f.assignee.displayName) || "Unassigned",
    priority: (f.priority && f.priority.name) || null,
    points: Number(f[pointsField]) || 1, // falls back to counting the issue itself as 1pt if story points aren't tracked
    created: f.created,
    updated: f.updated,
    resolved: f.resolutiondate,
    startDate: (startDateField && f[startDateField]) || null,
    dueDate: (dueDateField && f[dueDateField]) || null,
    origEndDate: (origEndDateField && f[origEndDateField]) || null,
    sprint: sprintField ? parseSprintField(f[sprintField]) : null,
    parent: extractGanttParent(f, parentField),
    component: (f.components && f.components.length) ? f.components.map((c) => c.name).join(", ") : "",
    leadingTrack: (leadingTrackField && f[leadingTrackField]) || null,
    // Jira's native worklog total (seconds), no config needed — used to show
    // "completed hours" logged so far against a sub-track's capacity.
    timeSpentHours: f.timespent ? +(f.timespent / 3600).toFixed(1) : 0,
  };
}
function jiraIssueFromFlat(iss) {
  return {
    key: iss.key || "?",
    summary: iss.summary || "",
    status: iss.status || "Unknown",
    statusCategory: iss.statusCategory || "new",
    type: iss.type || iss.issueType || null,
    assignee: iss.assignee || "Unassigned",
    priority: iss.priority || null,
    points: Number(iss.points) || 1,
    created: iss.created,
    updated: iss.updated,
    resolved: iss.resolved,
    startDate: iss.startDate || null,
    dueDate: iss.dueDate || null,
    origEndDate: iss.origEndDate || null,
    sprint: iss.sprint || null,
    parent: iss.parent ? (typeof iss.parent === "string" ? { key: iss.parent, summary: "" } : iss.parent) : null,
    component: iss.component || (Array.isArray(iss.components) ? iss.components.join(", ") : "") || "",
    leadingTrack: iss.leadingTrack || null,
    timeSpentHours: iss.timeSpentHours != null ? Number(iss.timeSpentHours) || 0 : (iss.timespent ? +(Number(iss.timespent) / 3600).toFixed(1) : 0),
  };
}

function isoWeekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
  return `${date.getUTCFullYear()}-W${String(weekNo).padStart(2, "0")}`;
}

// Builds day- or week-granularity burndown/burnup series from a flat issue list.
// Scope-so-far and done-so-far are both running totals as of each bucket's date,
// so the chart reflects scope creep as well as completion.
function computeBurnSeries(issues, granularity) {
  if (!issues.length) return { labels: [], totalScope: [], remaining: [], completed: [], ideal: [] };
  const toDay = (iso) => (iso ? new Date(iso.slice(0, 10)) : null);
  const created = issues.map((i) => toDay(i.created)).filter(Boolean);
  if (!created.length) return { labels: [], totalScope: [], remaining: [], completed: [], ideal: [] };
  const resolvedDates = issues.map((i) => toDay(i.resolved)).filter(Boolean);
  const start = new Date(Math.min(...created.map((d) => d.getTime())));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const latestResolved = resolvedDates.length ? new Date(Math.max(...resolvedDates.map((d) => d.getTime()))) : start;
  const end = latestResolved.getTime() > today.getTime() ? latestResolved : today;

  const days = [];
  let cur = new Date(start); cur.setHours(0, 0, 0, 0);
  const stop = new Date(end); stop.setHours(0, 0, 0, 0);
  while (cur <= stop && days.length < 3000) { days.push(new Date(cur)); cur = new Date(cur.getTime() + 86400000); }

  const dayStats = days.map((d) => {
    const t = d.getTime();
    const scope = issues.filter((i) => { const c = toDay(i.created); return c && c.getTime() <= t; }).reduce((s, i) => s + (i.points || 0), 0);
    const done = issues.filter((i) => { const r = toDay(i.resolved); return r && r.getTime() <= t; }).reduce((s, i) => s + (i.points || 0), 0);
    return { date: d, scope, done, remaining: scope - done };
  });

  let buckets = dayStats;
  if (granularity === "week") {
    const byWeek = {};
    dayStats.forEach((s) => { byWeek[isoWeekKey(s.date)] = s; }); // last day seen per week wins (running totals)
    buckets = Object.keys(byWeek).sort().map((k) => byWeek[k]);
  }

  const idealStart = buckets.length ? buckets[0].scope : 0;
  const idealSlope = buckets.length > 1 ? idealStart / (buckets.length - 1) : 0;

  return {
    labels: buckets.map((b) => (granularity === "week" ? isoWeekKey(b.date) : b.date.toISOString().slice(5, 10))),
    totalScope: buckets.map((b) => b.scope),
    remaining: buckets.map((b) => b.remaining),
    completed: buckets.map((b) => b.done),
    ideal: buckets.map((_, idx) => Math.max(0, +(idealStart - idealSlope * idx).toFixed(1))),
  };
}

function computeTeamStats(issues) {
  const byAssignee = {};
  issues.forEach((i) => {
    const key = i.assignee || "Unassigned";
    if (!byAssignee[key]) byAssignee[key] = { assignee: key, totalPoints: 0, donePoints: 0, totalCount: 0, doneCount: 0, inProgress: 0, todo: 0 };
    const b = byAssignee[key];
    b.totalPoints += i.points || 0;
    b.totalCount += 1;
    if (i.statusCategory === "done") { b.donePoints += i.points || 0; b.doneCount += 1; }
    else if (i.statusCategory === "indeterminate") b.inProgress += 1;
    else b.todo += 1;
  });
  return Object.values(byAssignee).sort((a, b) => b.totalPoints - a.totalPoints);
}

// Program Velocity / Throughput (Say/Do Ratio): committed points at the
// start of each sprint vs. points actually delivered — same idea as
// comparing Epic/Feature status "at start date vs. end date" of a PI/Quarter.
function computeVelocityStats(issues) {
  const bySprint = {};
  issues.forEach((i) => {
    const name = (i.sprint && i.sprint.name) || "No sprint";
    if (!bySprint[name]) bySprint[name] = { sprint: name, committed: 0, completed: 0, count: 0 };
    const b = bySprint[name];
    b.committed += i.points || 0;
    b.count += 1;
    if (i.statusCategory === "done") b.completed += i.points || 0;
  });
  const rows = Object.values(bySprint)
    .filter((r) => r.sprint !== "No sprint")
    .sort((a, b) => a.sprint.localeCompare(b.sprint, undefined, { numeric: true }));
  const withRatio = rows.map((r) => ({ ...r, sayDo: r.committed ? Math.round((r.completed / r.committed) * 1000) / 10 : 0 }));
  const totalCommitted = withRatio.reduce((s, r) => s + r.committed, 0);
  const totalCompleted = withRatio.reduce((s, r) => s + r.completed, 0);
  const overallSayDo = totalCommitted ? Math.round((totalCompleted / totalCommitted) * 1000) / 10 : 0;
  return { rows: withRatio, overallSayDo, totalCommitted, totalCompleted };
}

const MS_PER_DAY = 86400000;
// Program Lead Time & Cycle Time: lead time = created -> resolved; cycle
// time = start date -> resolved (falls back to lead time when no Start
// Date is tracked on the issue).
function computeLeadCycleStats(issues) {
  const toDay = (iso) => (iso ? new Date(iso.slice(0, 10)) : null);
  const rows = issues
    .map((i) => {
      const created = toDay(i.created);
      const resolved = toDay(i.resolved);
      const started = toDay(i.startDate);
      if (!created || !resolved) return null;
      const leadDays = Math.max(0, Math.round((resolved - created) / MS_PER_DAY));
      const cycleDays = started ? Math.max(0, Math.round((resolved - started) / MS_PER_DAY)) : leadDays;
      return { key: i.key, summary: i.summary, type: i.type, leadDays, cycleDays, resolved };
    })
    .filter(Boolean);
  const avg = (arr, k) => (arr.length ? Math.round((arr.reduce((s, r) => s + r[k], 0) / arr.length) * 10) / 10 : 0);
  const byMonth = {};
  rows.forEach((r) => {
    const m = r.resolved.toISOString().slice(0, 7);
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(r);
  });
  const months = Object.keys(byMonth).sort();
  const slowest = [...rows].sort((a, b) => b.cycleDays - a.cycleDays).slice(0, 8);
  return {
    rows, avgLead: avg(rows, "leadDays"), avgCycle: avg(rows, "cycleDays"),
    trend: { labels: months, lead: months.map((m) => avg(byMonth[m], "leadDays")), cycle: months.map((m) => avg(byMonth[m], "cycleDays")) },
    slowest,
  };
}

// Flow Efficiency: active (Start Date -> Due Date, the planned working
// window) vs. total elapsed (Created -> Resolved). Approximated from the
// Start/Due/Created/Resolved fields already on each issue, since a full
// changelog-based "time in each status" expansion isn't imported here.
function computeFlowEfficiency(issues) {
  const toDay = (iso) => (iso ? new Date(iso.slice(0, 10)) : null);
  const rows = issues
    .map((i) => {
      const created = toDay(i.created), resolved = toDay(i.resolved), started = toDay(i.startDate), due = toDay(i.dueDate);
      if (!created || !resolved) return null;
      const total = Math.max(1, (resolved - created) / MS_PER_DAY);
      const activeEnd = due && due < resolved ? due : resolved;
      const activeStart = started || created;
      const active = Math.max(0, Math.min(total, (activeEnd - activeStart) / MS_PER_DAY));
      return { key: i.key, type: i.type, efficiency: Math.round((active / total) * 1000) / 10, active, wait: total - active };
    })
    .filter(Boolean);
  const totalActive = rows.reduce((s, r) => s + r.active, 0);
  const totalWait = rows.reduce((s, r) => s + r.wait, 0);
  const overall = (totalActive + totalWait) ? Math.round((totalActive / (totalActive + totalWait)) * 1000) / 10 : 0;
  const byType = {};
  rows.forEach((r) => {
    const t = r.type || "Other";
    if (!byType[t]) byType[t] = [];
    byType[t].push(r.efficiency);
  });
  const typeRows = Object.keys(byType).map((t) => ({ type: t, avg: Math.round((byType[t].reduce((s, v) => s + v, 0) / byType[t].length) * 10) / 10, count: byType[t].length }));
  return { rows, overall, totalActive: Math.round(totalActive), totalWait: Math.round(totalWait), typeRows };
}

// Cross-Team Dependency Density: proxy for cross-team blockages using
// Component as the team boundary (no issue-link/changelog data is imported
// here), grouped under each parent Epic — an epic whose children span more
// than one component is a likely cross-team dependency cluster.
function computeDependencyDensity(issues) {
  const byParent = {};
  issues.forEach((i) => {
    if (!i.parent || !i.parent.key) return;
    const key = i.parent.key;
    if (!byParent[key]) byParent[key] = { key, summary: i.parent.summary, components: new Set(), count: 0 };
    (i.component || "Unassigned").split(",").map((c) => c.trim()).filter(Boolean).forEach((c) => byParent[key].components.add(c));
    byParent[key].count += 1;
  });
  const epics = Object.values(byParent).map((e) => ({ ...e, componentCount: e.components.size, components: [...e.components] }));
  const crossTeam = epics.filter((e) => e.componentCount > 1).sort((a, b) => b.componentCount - a.componentCount);
  const density = epics.length ? Math.round((crossTeam.length / epics.length) * 1000) / 10 : 0;
  return { epics, crossTeam, density, totalEpics: epics.length };
}

// Groups issues by sprint and scores each sprint's health from its overdue
// ratio (Off Track / At Risk / On Track — same three buckets as a typical
// portfolio "project health" gauge), plus an overall status breakdown.
function computeOverviewStats(issues) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const bySprint = {};
  issues.forEach((i) => {
    const key = (i.sprint && i.sprint.name) || "No sprint";
    if (!bySprint[key]) bySprint[key] = { name: key, state: (i.sprint && i.sprint.state) || "unknown", issues: [] };
    bySprint[key].issues.push(i);
  });
  const sprintRows = Object.values(bySprint).map((s) => {
    const total = s.issues.length;
    const done = s.issues.filter((i) => i.statusCategory === "done").length;
    const overdue = s.issues.filter((i) => i.statusCategory !== "done" && i.dueDate && new Date(i.dueDate) < today).length;
    const overdueRatio = total ? overdue / total : 0;
    const health = overdueRatio > 0.2 ? "Off Track" : overdueRatio > 0 ? "At Risk" : "On Track";
    return { name: s.name, state: s.state, total, done, overdue, health, pctDone: total ? Math.round((done / total) * 100) : 0 };
  }).sort((a, b) => a.name.localeCompare(b.name));

  const healthCounts = { "Off Track": 0, "At Risk": 0, "On Track": 0 };
  sprintRows.forEach((s) => { healthCounts[s.health] += 1; });

  const statusCounts = { new: 0, indeterminate: 0, done: 0 };
  issues.forEach((i) => { statusCounts[i.statusCategory] = (statusCounts[i.statusCategory] || 0) + 1; });

  return { sprintRows, healthCounts, statusCounts, totalIssues: issues.length };
}

// Working (Mon-Fri) days in the current calendar month — stands in for "1
// month of sprint" capacity math (7h/day x working days x headcount).
function getWorkingDaysInCurrentMonth() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  let count = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(y, m, d).getDay(); // 0 = Sun, 6 = Sat
    if (dow !== 0 && dow !== 6) count++;
  }
  return count;
}

// Picks the "current sprint" name: the most common sprint marked state
// "active" among the loaded issues; falls back to the most recent sprint
// name (natural sort) when no sprint is flagged active (e.g. classic Jira
// sprint-field strings that didn't carry a state).
function pickCurrentSprintName(issues) {
  const withSprint = issues.filter((i) => i.sprint && i.sprint.name);
  if (!withSprint.length) return null;
  const active = withSprint.filter((i) => i.sprint.state === "active");
  if (active.length) {
    const counts = {};
    active.forEach((i) => { counts[i.sprint.name] = (counts[i.sprint.name] || 0) + 1; });
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  }
  const names = [...new Set(withSprint.map((i) => i.sprint.name))];
  names.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  return names[names.length - 1];
}

// Groups issues into sub-tracks (Leading Track field, falling back to
// Component, then "Unassigned") and, for each, computes:
//  - team capacity in hours = unique assignees x working days this month x 7h
//  - total story points committed by the team in the current sprint
//  - hours completed so far (summed Jira worklog time) in the current sprint
//  - story points completed in the current sprint
function computeSubTrackStats(issues) {
  const workingDays = getWorkingDaysInCurrentMonth();
  const currentSprintName = pickCurrentSprintName(issues);

  const byTrack = {};
  issues.forEach((i) => {
    const key = i.leadingTrack || i.component || "Unassigned";
    if (!byTrack[key]) byTrack[key] = { track: key, allIssues: [], sprintIssues: [] };
    byTrack[key].allIssues.push(i);
    if (currentSprintName && i.sprint && i.sprint.name === currentSprintName) byTrack[key].sprintIssues.push(i);
  });

  const rows = Object.values(byTrack).map((t) => {
    // Team headcount is read off whoever's assigned work in the current
    // sprint; if the track has no current-sprint issues yet, fall back to
    // everyone ever assigned under that track so capacity isn't zero.
    const teamPool = t.sprintIssues.length ? t.sprintIssues : t.allIssues;
    const teamSize = new Set(teamPool.map((i) => i.assignee || "Unassigned")).size || 1;
    const capacityHours = teamSize * workingDays * 7;
    const committedPoints = t.sprintIssues.reduce((s, i) => s + (i.points || 0), 0);
    const completedPoints = t.sprintIssues.filter((i) => i.statusCategory === "done").reduce((s, i) => s + (i.points || 0), 0);
    const completedHours = Math.round(t.sprintIssues.reduce((s, i) => s + (i.timeSpentHours || 0), 0) * 10) / 10;
    return {
      track: t.track,
      teamSize,
      capacityHours,
      committedPoints,
      completedPoints,
      completedHours,
      totalIssues: t.sprintIssues.length,
      pctDone: committedPoints ? Math.round((completedPoints / committedPoints) * 100) : 0,
    };
  }).sort((a, b) => a.track.localeCompare(b.track, undefined, { numeric: true }));

  return {
    rows,
    currentSprintName,
    workingDays,
    totals: {
      tracks: rows.length,
      capacityHours: rows.reduce((s, r) => s + r.capacityHours, 0),
      committedPoints: rows.reduce((s, r) => s + r.committedPoints, 0),
      completedPoints: rows.reduce((s, r) => s + r.completedPoints, 0),
      completedHours: Math.round(rows.reduce((s, r) => s + r.completedHours, 0) * 10) / 10,
    },
  };
}

// One bar per issue that has a start and/or due date, sorted earliest-first.
function computeGanttRows(issues) {
  return issues
    .filter((i) => i.startDate || i.dueDate)
    .map((i) => {
      const start = i.startDate ? new Date(i.startDate) : new Date(i.dueDate);
      let end = i.dueDate ? new Date(i.dueDate) : new Date(i.startDate);
      if (end < start) end = start;
      return { key: i.key, summary: i.summary, statusCategory: i.statusCategory, start, end };
    })
    .filter((r) => !isNaN(r.start) && !isNaN(r.end))
    .sort((a, b) => a.start - b.start);
}

// ---------------------------------------------------------------------------
// Gantt v2 — an OKR-roadmap-style tree table (parent/child rows, colored type
// badges, colored status pills, toggleable metadata columns) with a frozen
// label column and a scrollable timeline on the right. Everything below is
// used by the <GanttChart> component further down.
// ---------------------------------------------------------------------------

// Badge shown before each row's key — mirrors the little colored ST/O/KR
// chips in the reference OKR view, but keyed off Jira's own issue type.
const GANTT_TYPE_META = {
  "Epic": { abbr: "EP", bg: "#F3EEFF", fg: "#5B21B6" },
  "Story": { abbr: "ST", bg: "#E7F7EE", fg: "#0E4227" },
  "Task": { abbr: "TA", bg: "#EAF1FB", fg: "#173561" },
  "Sub-task": { abbr: "SB", bg: "#F0F1F3", fg: "#3C4451" },
  "Subtask": { abbr: "SB", bg: "#F0F1F3", fg: "#3C4451" },
  "Bug": { abbr: "BG", bg: "#FBEAEA", fg: "#7A2020" },
  "Initiative": { abbr: "IN", bg: "#FFF1E6", fg: "#7A360B" },
};
function ganttTypeMeta(type) {
  if (type && GANTT_TYPE_META[type]) return GANTT_TYPE_META[type];
  const abbr = type ? type.replace(/[^A-Za-z]/g, "").slice(0, 2).toUpperCase() || "IS" : "IS";
  return { abbr, bg: "#F0F1F3", fg: "#3C4451" };
}

// Status pill palette — keyed by common status-name phrasing first (so text
// like "On Track" / "At Risk" / "Off Track" / "Blocked" reads the same way
// the reference view colors them), falling back to Jira's 3 status
// categories (done / indeterminate / new) for anything unrecognized.
const GANTT_STATUS_STYLES = {
  "done": { bg: "#E7F7EE", fg: "#0E4227", dot: "#1E7A47" },
  "success": { bg: "#E7F7EE", fg: "#0E4227", dot: "#1E7A47" },
  "on track": { bg: "#E7F7EE", fg: "#0E4227", dot: "#1E7A47" },
  "in progress": { bg: "#EAF1FB", fg: "#173561", dot: "#2F5FA8" },
  "at risk": { bg: "#FFF4DD", fg: "#7A4A08", dot: "#B8850F" },
  "in review": { bg: "#FFF4DD", fg: "#7A4A08", dot: "#B8850F" },
  "off track": { bg: "#FBEAEA", fg: "#7A2020", dot: "#C23B3B" },
  "blocked": { bg: "#FBEAEA", fg: "#7A2020", dot: "#C23B3B" },
  "not started": { bg: "#F0F1F3", fg: "#3C4451", dot: "#9AA1AC" },
  "to do": { bg: "#F0F1F3", fg: "#3C4451", dot: "#9AA1AC" },
};
function ganttStatusStyle(status, statusCategory) {
  const key = (status || "").trim().toLowerCase();
  if (GANTT_STATUS_STYLES[key]) return GANTT_STATUS_STYLES[key];
  if (statusCategory === "done") return GANTT_STATUS_STYLES["done"];
  if (statusCategory === "indeterminate") return GANTT_STATUS_STYLES["in progress"];
  return GANTT_STATUS_STYLES["not started"];
}

function ganttFmtDate(d) {
  if (!d) return null;
  const dt = d instanceof Date ? d : new Date(d);
  if (isNaN(dt)) return null;
  return dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

// Every optional column the Gantt can show, beyond the always-on Key column.
// `get` pulls the raw display value straight off a jira issue object.
const GANTT_COLUMNS = [
  { id: "parent", label: "Parent", width: 120, get: (i) => (i.parent ? i.parent.key : "") },
  { id: "startDate", label: "Start date", width: 104, get: (i) => ganttFmtDate(i.startDate) || "" },
  { id: "endDate", label: "End date", width: 104, get: (i) => ganttFmtDate(i.dueDate) || "" },
  { id: "origEndDate", label: "Original end date", width: 130, get: (i) => ganttFmtDate(i.origEndDate) || "" },
  { id: "assignee", label: "Assignee", width: 130, get: (i) => i.assignee || "" },
  { id: "leadingTrack", label: "Leading track", width: 130, get: (i) => i.leadingTrack || "" },
  { id: "sprint", label: "Sprint", width: 120, get: (i) => (i.sprint && i.sprint.name) || "" },
  { id: "status", label: "Status", width: 130, get: (i) => i.status || "" },
  { id: "component", label: "Component", width: 130, get: (i) => i.component || "" },
];
const GANTT_DEFAULT_COLUMNS = { status: true, assignee: true, sprint: true, parent: false, startDate: false, endDate: false, origEndDate: false, leadingTrack: false, component: false };

// Builds a parent/child tree out of the flat issue list (matching each
// issue's `parent.key` against another issue's `key`; anything whose parent
// isn't in the loaded set — or has none — becomes a root). Rows with no
// dates of their own but with dated descendants get a rolled-up start/end
// spanning their children, rendered as a hollow bar.
function buildGanttTree(issues) {
  const byKey = {};
  issues.forEach((i) => { byKey[i.key] = { issue: i, children: [] }; });
  const roots = [];
  issues.forEach((i) => {
    const node = byKey[i.key];
    const parentKey = i.parent && i.parent.key;
    if (parentKey && byKey[parentKey]) byKey[parentKey].children.push(node);
    else roots.push(node);
  });
  const ownRange = (issue) => {
    if (!issue.startDate && !issue.dueDate) return null;
    const start = new Date(issue.startDate || issue.dueDate);
    let end = new Date(issue.dueDate || issue.startDate);
    if (isNaN(start) || isNaN(end)) return null;
    if (end < start) end = start;
    return { start, end };
  };
  // Post-order: compute each node's own range, then fold in children's
  // ranges (recursively) so ancestors roll up their whole subtree.
  const computeRange = (node) => {
    let range = ownRange(node.issue);
    let rollup = false;
    node.children.forEach((c) => {
      const childRange = computeRange(c);
      if (!childRange) return;
      if (!range) { range = { start: childRange.start, end: childRange.end }; rollup = true; }
      else {
        if (childRange.start < range.start) range.start = childRange.start;
        if (childRange.end > range.end) range.end = childRange.end;
      }
    });
    node.range = range;
    node.isRollup = rollup;
    return range;
  };
  const sortSiblings = (list) => {
    list.forEach((n) => sortSiblings(n.children));
    list.sort((a, b) => {
      const at = a.range ? a.range.start.getTime() : Infinity;
      const bt = b.range ? b.range.start.getTime() : Infinity;
      return at - bt;
    });
  };
  roots.forEach(computeRange);
  sortSiblings(roots);
  return roots;
}

// Flattens the tree into an ordered array of visible rows (skips children of
// collapsed nodes), tagging each with its depth for indentation.
function flattenGanttTree(roots, collapsed, depth = 0, out = []) {
  roots.forEach((node) => {
    out.push({ node, depth, hasChildren: node.children.length > 0, expanded: !collapsed.has(node.issue.key) });
    if (node.children.length && !collapsed.has(node.issue.key)) {
      flattenGanttTree(node.children, collapsed, depth + 1, out);
    }
  });
  return out;
}

// ---- Day-precision timeline helpers for the Gantt ruler ----
const GANTT_DAY_MS = 1000 * 60 * 60 * 24;
function ganttStartOfDay(d) {
  const n = new Date(d);
  n.setHours(0, 0, 0, 0);
  return n;
}
function ganttIsSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
// Builds the two-row date ruler (month groups + individual day cells) plus
// per-day background column data, across [minT, maxT) at `pxPerDay` pixels
// per day. Shared by the header ruler and the row backgrounds so they always
// line up with the bars, which are positioned with the same math.
function buildGanttRuler(minT, maxT, pxPerDay) {
  const days = [];
  const months = [];
  const today = new Date();
  let cursor = ganttStartOfDay(new Date(minT));
  const end = new Date(maxT);
  let i = 0;
  let curMonthKey = null;
  while (cursor.getTime() < end.getTime()) {
    const x = i * pxPerDay;
    const dow = cursor.getDay();
    days.push({
      x, label: cursor.getDate(),
      isWeekend: dow === 0 || dow === 6,
      isToday: ganttIsSameDay(cursor, today),
    });
    const mKey = cursor.getFullYear() + "-" + cursor.getMonth();
    if (mKey !== curMonthKey) {
      if (months.length) months[months.length - 1].width = x - months[months.length - 1].x;
      months.push({ x, label: cursor.toLocaleDateString(undefined, { month: "long", year: "numeric" }) });
      curMonthKey = mKey;
    }
    cursor = new Date(cursor.getTime() + GANTT_DAY_MS);
    i += 1;
  }
  if (months.length) months[months.length - 1].width = i * pxPerDay - months[months.length - 1].x;
  return { days, months, totalDays: i };
}

const PRIORITY_ORDER = ["Highest", "High", "Medium", "Low", "Lowest"];
const PRIORITY_COLOR = { Highest: "#C23B3B", High: "#E07A3F", Medium: "#B8850F", Low: "#2F5FA8", Lowest: "#9AA1AC", Unset: "#C7CCD4" };

// Jira issues don't carry dedicated risk data (no likelihood/impact fields
// out of the box), so this uses Priority as the closest available stand-in
// for risk severity — clearly labeled as such wherever it's shown.
function computeRiskBreakdown(issues) {
  const counts = {};
  issues.forEach((i) => { const p = i.priority || "Unset"; counts[p] = (counts[p] || 0) + 1; });
  const labels = Object.keys(counts).sort((a, b) => {
    const ai = PRIORITY_ORDER.indexOf(a), bi = PRIORITY_ORDER.indexOf(b);
    if (ai === -1 && bi === -1) return a.localeCompare(b);
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });
  return { labels, counts };
}

const GANTT_PX_PER_DAY = 34;
const GANTT_ROW_H = 34;
const GANTT_HEADER_H = 48; // 22px month row + 26px day row, matches the left pane's header
const GANTT_EDGE_EXTEND_DAYS = 30; // how many days to add when the user pans near an edge
const GANTT_EDGE_TRIGGER_PX = GANTT_PX_PER_DAY * 8;

// OKR-roadmap-style Gantt: a frozen left pane (tree + optional metadata
// columns, laid out on a CSS grid so every row's columns line up pixel-for-
// pixel with the header) beside a right pane holding a sticky day/month date
// ruler and a horizontally-pannable bar timeline. The two panes' vertical
// scroll is kept in sync in JS. The timeline's date range silently grows
// whenever the user drags or scrolls near either edge, so panning feels
// unbounded in both directions rather than stopping at the data's own dates.
function GanttChart({ issues }) {
  const [collapsed, setCollapsed] = useState(() => new Set());
  const [columns, setColumns] = useState(GANTT_DEFAULT_COLUMNS);
  const [columnsOpen, setColumnsOpen] = useState(false);
  const popRef = useRef(null);
  const leftRef = useRef(null);
  const rightRef = useRef(null);
  const syncingScrollRef = useRef(false);
  const dragRef = useRef(null);
  const pendingLeftExtendPxRef = useRef(0);
  const [dragging, setDragging] = useState(false);

  useEffect(() => {
    if (!columnsOpen) return;
    const onDoc = (e) => { if (popRef.current && !popRef.current.contains(e.target)) setColumnsOpen(false); };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [columnsOpen]);

  const tree = useMemo(() => buildGanttTree(issues), [issues]);
  const flat = useMemo(() => flattenGanttTree(tree, collapsed), [tree, collapsed]);

  // Range straight from the data (ignores collapse state, so panning doesn't
  // reset when a row is expanded/collapsed). Recomputed only when the issue
  // set itself changes.
  const dataRange = useMemo(() => {
    const dated = issues.filter((i) => i.startDate || i.dueDate);
    if (dated.length) {
      const starts = dated.map((i) => new Date(i.startDate || i.dueDate).getTime());
      const ends = dated.map((i) => new Date(i.dueDate || i.startDate).getTime());
      let mn = Math.min(...starts), mx = Math.max(...ends);
      if (mx < mn) mx = mn;
      const today = Date.now();
      if (today < mn) mn = today;
      if (today > mx) mx = today;
      return {
        min: ganttStartOfDay(new Date(mn - GANTT_DAY_MS * 14)).getTime(),
        max: ganttStartOfDay(new Date(mx + GANTT_DAY_MS * 14)).getTime(),
      };
    }
    const today = ganttStartOfDay(new Date()).getTime();
    return { min: today - GANTT_DAY_MS * 14, max: today + GANTT_DAY_MS * 30 };
  }, [issues]);

  // Pannable range, seeded from dataRange and free to grow in either
  // direction as the user scrolls/drags near an edge — this is what gives
  // the timeline its "infinite" feel.
  const [range, setRange] = useState(dataRange);
  useEffect(() => { setRange(dataRange); }, [dataRange.min, dataRange.max]);

  const extendLeft = useCallback(() => {
    const addPx = GANTT_EDGE_EXTEND_DAYS * GANTT_PX_PER_DAY;
    pendingLeftExtendPxRef.current += addPx;
    setRange((r) => ({ min: r.min - GANTT_DAY_MS * GANTT_EDGE_EXTEND_DAYS, max: r.max }));
  }, []);
  const extendRight = useCallback(() => {
    setRange((r) => ({ min: r.min, max: r.max + GANTT_DAY_MS * GANTT_EDGE_EXTEND_DAYS }));
  }, []);

  // After extending backward, the content grows to the left, so nudge
  // scrollLeft forward by the same amount to keep the view visually stable.
  useEffect(() => {
    if (pendingLeftExtendPxRef.current && rightRef.current) {
      rightRef.current.scrollLeft += pendingLeftExtendPxRef.current;
      pendingLeftExtendPxRef.current = 0;
    }
  }, [range.min]);

  if (!issues.length) {
    return (
      <div className="jira-status-line info">
        No issues have a start or due date yet — set the Start/Due date field ids on the Connect tab and re-fetch.
      </div>
    );
  }

  const activeCols = GANTT_COLUMNS.filter((c) => columns[c.id]);
  const labelW = 320;
  const leftW = labelW + activeCols.reduce((s, c) => s + c.width, 0);
  const gridTemplate = [labelW, ...activeCols.map((c) => c.width)].map((w) => `${w}px`).join(" ");

  const ruler = useMemo(() => buildGanttRuler(range.min, range.max, GANTT_PX_PER_DAY), [range.min, range.max]);
  const chartW = ruler.totalDays * GANTT_PX_PER_DAY;
  const xOf = (t) => ((t - range.min) / GANTT_DAY_MS) * GANTT_PX_PER_DAY;
  const todayX = xOf(Date.now());
  const rowsH = flat.length * GANTT_ROW_H;

  const toggleCollapse = (key) => setCollapsed((prev) => {
    const next = new Set(prev);
    if (next.has(key)) next.delete(key); else next.add(key);
    return next;
  });
  const expandAll = () => setCollapsed(new Set());
  const collapseAll = () => {
    const withKids = new Set();
    const walk = (nodes) => nodes.forEach((n) => { if (n.children.length) { withKids.add(n.issue.key); walk(n.children); } });
    walk(tree);
    setCollapsed(withKids);
  };

  // Keep the two panes' vertical scroll positions in sync, and grow the
  // pannable range when the timeline is scrolled near either edge.
  const onLeftScroll = (e) => {
    if (syncingScrollRef.current) return;
    syncingScrollRef.current = true;
    if (rightRef.current) rightRef.current.scrollTop = e.target.scrollTop;
    syncingScrollRef.current = false;
  };
  const onRightScroll = (e) => {
    const el = e.target;
    if (!syncingScrollRef.current) {
      syncingScrollRef.current = true;
      if (leftRef.current) leftRef.current.scrollTop = el.scrollTop;
      syncingScrollRef.current = false;
    }
    if (el.scrollLeft < GANTT_EDGE_TRIGGER_PX) extendLeft();
    else if (el.scrollWidth - (el.scrollLeft + el.clientWidth) < GANTT_EDGE_TRIGGER_PX) extendRight();
  };

  // Click-and-drag panning on the timeline (in addition to native
  // scrollbars/trackpad/wheel scrolling, which keep working as-is).
  const onRightMouseDown = (e) => {
    if (e.button !== 0 || !rightRef.current) return;
    dragRef.current = {
      startX: e.clientX, startY: e.clientY,
      startScrollLeft: rightRef.current.scrollLeft, startScrollTop: rightRef.current.scrollTop,
    };
    setDragging(true);
  };
  useEffect(() => {
    if (!dragging) return;
    const onMove = (e) => {
      if (!dragRef.current || !rightRef.current) return;
      rightRef.current.scrollLeft = dragRef.current.startScrollLeft - (e.clientX - dragRef.current.startX);
      rightRef.current.scrollTop = dragRef.current.startScrollTop - (e.clientY - dragRef.current.startY);
    };
    const onUp = () => { setDragging(false); dragRef.current = null; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => { window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
  }, [dragging]);

  return (
    <div>
      <div className="gantt-toolbar">
        <div className="gantt-toolbar-left">
          <button className="gantt-tool-btn" onClick={expandAll}>▾ Expand all</button>
          <button className="gantt-tool-btn" onClick={collapseAll}>▸ Collapse all</button>
          <span className="gantt-toolbar-hint">Drag the timeline to pan — it keeps extending as you go.</span>
        </div>
        <div className="gantt-toolbar-right" ref={popRef}>
          <button className="gantt-tool-btn" onClick={() => setColumnsOpen((v) => !v)}>
            🧩 Columns {activeCols.length ? `(${activeCols.length})` : ""}
          </button>
          {columnsOpen && (
            <div className="gantt-columns-pop">
              <div className="gantt-columns-pop-title">Show columns</div>
              {GANTT_COLUMNS.map((c) => (
                <label key={c.id} className="gantt-columns-pop-row">
                  <input
                    type="checkbox"
                    checked={!!columns[c.id]}
                    onChange={(e) => setColumns((prev) => ({ ...prev, [c.id]: e.target.checked }))}
                  />
                  {c.label}
                </label>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="gantt-shell">
        {/* Frozen left pane: tree label + optional metadata columns */}
        <div className="gantt-left" style={{ width: leftW }} ref={leftRef} onScroll={onLeftScroll}>
          <div className="gantt-left-header">
            <div className="gantt-left-header-spacer" />
            <div className="gantt-left-header-cols" style={{ gridTemplateColumns: gridTemplate }}>
              <div className="gantt-left-head-cell">Key</div>
              {activeCols.map((c) => (
                <div key={c.id} className="gantt-left-head-cell">{c.label}</div>
              ))}
            </div>
          </div>
          {flat.map(({ node, depth, hasChildren, expanded }, idx) => {
            const issue = node.issue;
            const typeMeta = ganttTypeMeta(issue.type);
            const statusMeta = ganttStatusStyle(issue.status, issue.statusCategory);
            return (
              <div
                key={issue.key}
                className={`gantt-left-row ${idx % 2 ? "odd" : ""}`}
                style={{ height: GANTT_ROW_H, gridTemplateColumns: gridTemplate }}
              >
                <div className="gantt-left-cell gantt-cell-label">
                  <span className="gantt-indent" style={{ width: depth * 18 }} />
                  {hasChildren ? (
                    <button className="gantt-chevron" onClick={() => toggleCollapse(issue.key)}>{expanded ? "▾" : "▸"}</button>
                  ) : (
                    <span className="gantt-chevron-spacer" />
                  )}
                  <span className="gantt-type-badge" style={{ background: typeMeta.bg, color: typeMeta.fg }}>{typeMeta.abbr}</span>
                  <span className="gantt-key-text" title={`${issue.key} ${issue.summary}`}>
                    <span className="gantt-key-id">{issue.key}</span> {issue.summary}
                  </span>
                </div>
                {activeCols.map((c) => (
                  <div key={c.id} className="gantt-left-cell gantt-meta-cell" title={c.get(issue)}>
                    {c.id === "status" && issue.status ? (
                      <span className="gantt-status-pill" style={{ background: statusMeta.bg, color: statusMeta.fg }}>
                        <span className="gantt-status-dot" style={{ background: statusMeta.dot }} />
                        {issue.status}
                      </span>
                    ) : (c.get(issue) || <span className="gantt-cell-empty">—</span>)}
                  </div>
                ))}
              </div>
            );
          })}
        </div>

        {/* Right pane: sticky date ruler on top + pannable bar timeline */}
        <div
          className={`gantt-right ${dragging ? "dragging" : ""}`}
          ref={rightRef}
          onScroll={onRightScroll}
          onMouseDown={onRightMouseDown}
        >
          <div className="gantt-right-inner" style={{ width: chartW }}>
            <div className="gantt-ruler">
              <div className="gantt-ruler-months" style={{ width: chartW }}>
                {ruler.months.map((m, idx) => (
                  <div key={idx} className="gantt-ruler-month" style={{ left: m.x, width: m.width }}>{m.label}</div>
                ))}
              </div>
              <div className="gantt-ruler-days" style={{ width: chartW }}>
                {ruler.days.map((d, idx) => (
                  <div
                    key={idx}
                    className={`gantt-ruler-day ${d.isWeekend ? "weekend" : ""} ${d.isToday ? "today" : ""}`}
                    style={{ left: d.x, width: GANTT_PX_PER_DAY }}
                  >
                    {d.label}
                  </div>
                ))}
              </div>
            </div>

            <div className="gantt-right-rows" style={{ width: chartW, height: rowsH }}>
              {ruler.days.filter((d) => d.isWeekend).map((d, idx) => (
                <div key={idx} className="gantt-daycol weekend" style={{ left: d.x, width: GANTT_PX_PER_DAY, height: rowsH }} />
              ))}
              {todayX >= 0 && todayX <= chartW && (
                <div className="gantt-today-line" style={{ left: todayX, height: rowsH }} />
              )}
              {flat.map(({ node }, idx) => {
                const issue = node.issue;
                const statusMeta = ganttStatusStyle(issue.status, issue.statusCategory);
                const range2 = node.range;
                return (
                  <div key={issue.key} className={`gantt-right-row ${idx % 2 ? "odd" : ""}`} style={{ height: GANTT_ROW_H }}>
                    {range2 && (
                      <div
                        className={`gantt-bar ${node.isRollup ? "rollup" : ""}`}
                        style={{
                          left: xOf(range2.start.getTime()),
                          width: Math.max(4, xOf(range2.end.getTime()) - xOf(range2.start.getTime())),
                          background: node.isRollup ? "transparent" : statusMeta.dot,
                          borderColor: statusMeta.dot,
                        }}
                        title={`${ganttFmtDate(range2.start)} → ${ganttFmtDate(range2.end)}`}
                      />
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// Thin Chart.js wrapper: owns a canvas + chart instance, redraws when data changes.
function ChartCanvas({ type, data, options, height }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const dataKey = JSON.stringify(data);
  const optKey = JSON.stringify(options || {});
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext("2d"), { type, data, options: options || {} });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [type, dataKey, optKey]);
  // Chart.js's `responsive: true` + `maintainAspectRatio: false` (used by the
  // burndown/burnup/team-progress charts) sizes the canvas off its parent's
  // height. Without a parent that actually has a fixed height, the canvas has
  // nothing to measure against and either collapses to 0px or grows a little
  // taller on every re-render/resize. Giving it an explicit-height, relatively
  // positioned wrapper (Chart.js's own recommended fix) is what keeps it
  // rendering at a stable size instead of broken/blank/runaway-tall.
  return (
    <div style={{ position: "relative", width: "100%", height: height || 220 }}>
      <canvas ref={canvasRef}></canvas>
    </div>
  );
}

function App() {
  const [nodes, setNodes] = useState(initialNodes);

  const [modalNodeId, setModalNodeId] = useState(null);
  const [connectMode, setConnectMode] = useState(false);
  const [connectSource, setConnectSource] = useState(null);
  // View mode (default) is read-only: nodes can be selected and inspected but
  // not moved, added, connected, renamed, or deleted. Edit mode unlocks all of
  // that. Keeping mutation gated in one flag makes it hard to change the
  // diagram by accident while just browsing it.
  const [editMode, setEditMode] = useState(false);

  // ---- Multi-flowchart support (View tab sub-tabs) ----
  // "main" is the original epic lifecycle whiteboard; "detailed" is the more
  // granular flow imported from the epic-config-flow JSON export. Both share
  // every canvas/edit/demo feature — switching just swaps which node/edge set
  // is loaded into the (single) nodes/edges state below, stashing whichever
  // flow you're leaving so your edits to it are kept when you come back.
  const [flowMode, setFlowMode] = useState("main"); // "main" | "detailed"
  const flowDataRef = useRef({
    main: { nodes: initialNodes, edges: initialEdges },
    detailed: { nodes: DETAILED_NODES, edges: DETAILED_EDGES },
  });
  // Which named flow the runner animates: "main" (all details known), "partial"
  // (partial details capture), or "cr" (Change Request needed). Selectable from
  // the Demo tab and honored on both the Main Flow and Detailed flowchart views.
  const [demoFlowType, setDemoFlowType] = useState("main");
  const FLOW_TYPE_LABEL = { main: "Main flow", partial: "Partial flow", cr: "CR needed flow" };
  const demoSequence = useMemo(() => {
    const legacy = flowMode === "detailed" ? DETAILED_DEMO_SEQUENCE : DEMO_SEQUENCE;
    const numbered = nodes
      .filter((n) => n.flowOrder && n.flowOrder[demoFlowType] != null)
      .sort((a, b) => a.flowOrder[demoFlowType] - b.flowOrder[demoFlowType])
      .map((n) => n.id);
    // Fall back to the legacy full walkthrough if this flow has no numbered
    // nodes yet (e.g. "main" before any seeding), so Demo never comes up empty.
    return numbered.length > 0 ? numbered : legacy;
  }, [nodes, flowMode, demoFlowType]);

  // ---- Undo / redo (Ctrl/Cmd+Z, Ctrl/Cmd+Shift+Z) ----
  // Watches nodes/edges and, after a short pause in activity, snapshots the
  // state that came before the pause. This coalesces a whole drag or a burst
  // of typing into a single undo step instead of one step per pixel/keystroke,
  // without having to thread history calls through every individual setNodes
  // / setEdges call-site in the app.
  const undoStackRef = useRef([]);
  const redoStackRef = useRef([]);
  const lastSnapshotRef = useRef({ nodes: initialNodes, edges: initialEdges });
  const restoringRef = useRef(false);
  const historyTimerRef = useRef(null);
  const [canUndo, setCanUndo] = useState(false);
  const [canRedo, setCanRedo] = useState(false);

  useEffect(() => {
    if (restoringRef.current) {
      restoringRef.current = false;
      lastSnapshotRef.current = { nodes, edges };
      return;
    }
    if (historyTimerRef.current) clearTimeout(historyTimerRef.current);
    historyTimerRef.current = setTimeout(() => {
      undoStackRef.current.push(lastSnapshotRef.current);
      if (undoStackRef.current.length > 100) undoStackRef.current.shift();
      redoStackRef.current = [];
      lastSnapshotRef.current = { nodes, edges };
      setCanUndo(true);
      setCanRedo(false);
    }, 400);
    return () => { if (historyTimerRef.current) clearTimeout(historyTimerRef.current); };
  }, [nodes, edges]);

  const undo = useCallback(() => {
    if (historyTimerRef.current) { clearTimeout(historyTimerRef.current); historyTimerRef.current = null; }
    if (!undoStackRef.current.length) return;
    const prev = undoStackRef.current.pop();
    redoStackRef.current.push(lastSnapshotRef.current);
    restoringRef.current = true;
    lastSnapshotRef.current = prev;
    setNodes(prev.nodes);
    setEdges(prev.edges);
    setCanUndo(undoStackRef.current.length > 0);
    setCanRedo(true);
  }, []);

  const redo = useCallback(() => {
    if (!redoStackRef.current.length) return;
    const next = redoStackRef.current.pop();
    undoStackRef.current.push(lastSnapshotRef.current);
    restoringRef.current = true;
    lastSnapshotRef.current = next;
    setNodes(next.nodes);
    setEdges(next.edges);
    setCanUndo(true);
    setCanRedo(redoStackRef.current.length > 0);
  }, []);

  const DEFAULT_ZOOM = 0.62;
  const [pan, setPan] = useState({ x: 40, y: 20 - DEFAULT_ZOOM * TOP_PAD });
  const [zoom, setZoom] = useState(DEFAULT_ZOOM);
  const [showHelp, setShowHelp] = useState(false);
  const [ribbonTab, setRibbonTab] = useState("home"); // which ribbon tab's group panel is showing
  useEffect(() => {
    const tab = RIBBON_TABS.find((t) => t.id === ribbonTab);
    if (tab && tab.editOnly && !editMode) setRibbonTab("home");
  }, [editMode, ribbonTab]);
  const [activeRoles, setActiveRoles] = useState([]);
  const [configFlow, setConfigFlow] = useState(null); // null | 'partial' | 'newReq' | 'main'
  const [demoPlaying, setDemoPlaying] = useState(false);
  const [demoIndex, setDemoIndex] = useState(-1);
  const [commentDraft, setCommentDraft] = useState("");
  const [connectDrag, setConnectDrag] = useState(null); // { fromId, fromSide, x, y, hoverTargetId } while dragging a new connector from an anchor dot

  // ---------------- Metrics state ----------------
  // Lives inline on the Data tab's landing area (replaces the flowchart

  // Sub-tabs are built out one at a time; Gantt is the first.
  const [metricsSubTab, setMetricsSubTab] = useState("gantt");
  // Inner tab strip within Metrics > Gantt: timeline | burndown/burnup | team progress.
  const [ganttInnerTab, setGanttInnerTab] = useState("timeline");

  // ---------------- Jira dashboard state ----------------
  const [showJiraPanel, setShowJiraPanel] = useState(false);
  const [jiraTab, setJiraTab] = useState("connect"); // connect | burn | team
  const [jiraConfig, setJiraConfig] = useState({
    baseUrl: "", email: "", token: "", jql: "",
    pointsField: "customfield_10016",
    startDateField: "customfield_10015",
    dueDateField: "duedate",
    origEndDateField: "",
    sprintField: "customfield_10020",
    leadingTrackField: "",
    parentField: "",
    remember: false,
  });
  const [jiraIssues, setJiraIssues] = useState([]);
  const [jiraLoading, setJiraLoading] = useState(false);
  const [jiraError, setJiraError] = useState("");
  const [jiraInfo, setJiraInfo] = useState("");
  const [jiraGranularity, setJiraGranularity] = useState("day"); // day | week
  const [jiraProxyStatus, setJiraProxyStatus] = useState(""); // health-check readout for the connect tab
  const jiraFileInputRef = useRef(null);
  const jiraConfigFileInputRef = useRef(null); // hidden file input for importing a saved connection-settings JSON
  // Gantt rows for the Data tab's Metrics > Gantt sub-tab, derived straight
  // from the same jiraIssues the Jira Dashboard's Connect tab fetches.
  const ganttRows = useMemo(() => computeGanttRows(jiraIssues), [jiraIssues]);
  // Burndown/burnup and team-progress stats now live on the Data tab's
  // Metrics > Gantt sub-tab (moved out of the Jira Dashboard modal), but are
  // still derived from the same jiraIssues fetched via the Connect tab.
  const burnSeries = useMemo(() => computeBurnSeries(jiraIssues, jiraGranularity), [jiraIssues, jiraGranularity]);
  const teamStats = useMemo(() => computeTeamStats(jiraIssues), [jiraIssues]);
  const subTrackStats = useMemo(() => computeSubTrackStats(jiraIssues), [jiraIssues]);
  const velocityStats = useMemo(() => computeVelocityStats(jiraIssues), [jiraIssues]);
  const leadCycleStats = useMemo(() => computeLeadCycleStats(jiraIssues), [jiraIssues]);
  const flowEfficiencyStats = useMemo(() => computeFlowEfficiency(jiraIssues), [jiraIssues]);
  const dependencyStats = useMemo(() => computeDependencyDensity(jiraIssues), [jiraIssues]);
  // Shared empty-state used by the Gantt/Burndown/Burnup/Team Progress nav
  // items whenever no Jira issues are loaded yet.
  const noJiraDataBlock = (icon, label) => (
    <div className="metrics-empty">
      <div className="metrics-empty-icon">{icon}</div>
      <div className="metrics-empty-title">No Jira data loaded yet</div>
      <div className="metrics-empty-sub">Connect to Jira or import a JSON export to populate the {label} chart.</div>

  useEffect(() => {
    try {
      const saved = localStorage.getItem("jiraFlowConfig");

  const persistJiraConfig = (cfg) => {

      else localStorage.removeItem("jiraFlowConfig");
