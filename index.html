// ---------------- Jira integration helpers ----------------
function jiraIssueFromApi(iss, pointsField) {
  const f = iss.fields || {};
  return {
    key: iss.key,
    summary: f.summary || "",
    status: (f.status && f.status.name) || "Unknown",
    statusCategory: (f.status && f.status.statusCategory && f.status.statusCategory.key) || "new", // new | indeterminate | done
    assignee: (f.assignee && f.assignee.displayName) || "Unassigned",
    points: Number(f[pointsField]) || 1, // falls back to counting the issue itself as 1pt if story points aren't tracked
    created: f.created,
    updated: f.updated,
    resolved: f.resolutiondate,
  };
}
function jiraIssueFromFlat(iss) {
  return {
    key: iss.key || "?",
    summary: iss.summary || "",
    status: iss.status || "Unknown",
    statusCategory: iss.statusCategory || "new",
    assignee: iss.assignee || "Unassigned",
    points: Number(iss.points) || 1,
    created: iss.created,
    updated: iss.updated,
    resolved: iss.resolved,
  };
}

function isoWeekKey(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((date - yearStart) / 86400000 + 1) / 7);
  return `${date.getUTCFullYear()}-W${String(weekNo).padStart(2, "0")}`;
}

// Builds day- or week-granularity burndown/burnup series from a flat issue list.
// Scope-so-far and done-so-far are both running totals as of each bucket's date,
// so the chart reflects scope creep as well as completion.
function computeBurnSeries(issues, granularity) {
  if (!issues.length) return { labels: [], totalScope: [], remaining: [], completed: [], ideal: [] };
  const toDay = (iso) => (iso ? new Date(iso.slice(0, 10)) : null);
  const created = issues.map((i) => toDay(i.created)).filter(Boolean);
  if (!created.length) return { labels: [], totalScope: [], remaining: [], completed: [], ideal: [] };
  const resolvedDates = issues.map((i) => toDay(i.resolved)).filter(Boolean);
  const start = new Date(Math.min(...created.map((d) => d.getTime())));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const latestResolved = resolvedDates.length ? new Date(Math.max(...resolvedDates.map((d) => d.getTime()))) : start;
  const end = latestResolved.getTime() > today.getTime() ? latestResolved : today;

  const days = [];
  let cur = new Date(start); cur.setHours(0, 0, 0, 0);
  const stop = new Date(end); stop.setHours(0, 0, 0, 0);
  while (cur <= stop && days.length < 3000) { days.push(new Date(cur)); cur = new Date(cur.getTime() + 86400000); }

  const dayStats = days.map((d) => {
    const t = d.getTime();
    const scope = issues.filter((i) => { const c = toDay(i.created); return c && c.getTime() <= t; }).reduce((s, i) => s + (i.points || 0), 0);
    const done = issues.filter((i) => { const r = toDay(i.resolved); return r && r.getTime() <= t; }).reduce((s, i) => s + (i.points || 0), 0);
    return { date: d, scope, done, remaining: scope - done };
  });

  let buckets = dayStats;
  if (granularity === "week") {
    const byWeek = {};
    dayStats.forEach((s) => { byWeek[isoWeekKey(s.date)] = s; }); // last day seen per week wins (running totals)
    buckets = Object.keys(byWeek).sort().map((k) => byWeek[k]);
  }

  const idealStart = buckets.length ? buckets[0].scope : 0;
  const idealSlope = buckets.length > 1 ? idealStart / (buckets.length - 1) : 0;

  return {
    labels: buckets.map((b) => (granularity === "week" ? isoWeekKey(b.date) : b.date.toISOString().slice(5, 10))),
    totalScope: buckets.map((b) => b.scope),
    remaining: buckets.map((b) => b.remaining),
    completed: buckets.map((b) => b.done),
    ideal: buckets.map((_, idx) => Math.max(0, +(idealStart - idealSlope * idx).toFixed(1))),
  };
}

function computeTeamStats(issues) {
  const byAssignee = {};
  issues.forEach((i) => {
    const key = i.assignee || "Unassigned";
    if (!byAssignee[key]) byAssignee[key] = { assignee: key, totalPoints: 0, donePoints: 0, totalCount: 0, doneCount: 0, inProgress: 0, todo: 0 };
    const b = byAssignee[key];
    b.totalPoints += i.points || 0;
    b.totalCount += 1;
    if (i.statusCategory === "done") { b.donePoints += i.points || 0; b.doneCount += 1; }
    else if (i.statusCategory === "indeterminate") b.inProgress += 1;
    else b.todo += 1;
  });
  return Object.values(byAssignee).sort((a, b) => b.totalPoints - a.totalPoints);
}

// Thin Chart.js wrapper: owns a canvas + chart instance, redraws when data changes.
function ChartCanvas({ type, data, options, height }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const dataKey = JSON.stringify(data);
  const optKey = JSON.stringify(options || {});
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext("2d"), { type, data, options: options || {} });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [type, dataKey, optKey]);
  return <canvas ref={canvasRef} height={height || 220}></canvas>;
}

function App() {
  const [nodes, setNodes] = useState(initialNodes);
  const [edges, setEdges] = useState(initialEdges);
  const [selectedId, setSelectedId] = useState(null);
  const [selectedIds, setSelectedIds] = useState([]); // multi-select (shift/ctrl-click or marquee-drag)
  const [marquee, setMarquee] = useState(null); // {x1,y1,x2,y2} in node-space while marquee-dragging
  const [selectedEdgeId, setSelectedEdgeId] = useState(null);
  const [popupOpen, setPopupOpen] = useState(false); // shows the selection details as a pop-up modal instead of an always-on side panel
  const [editingId, setEditingId] = useState(null);
  const [draftText, setDraftText] = useState("");
  const [modalNodeId, setModalNodeId] = useState(null);
  const [connectMode, setConnectMode] = useState(false);
  const [connectSource, setConnectSource] = useState(null);
  // View mode (default) is read-only: nodes can be selected and inspected but
  // not moved, added, connected, renamed, or deleted. Edit mode unlocks all of
  // that. Keeping mutation gated in one flag makes it hard to change the
  // diagram by accident while just browsing it.
  const [editMode, setEditMode] = useState(false);

  // ---- Undo / redo (Ctrl/Cmd+Z, Ctrl/Cmd+Shift+Z) ----
  // Watches nodes/edges and, after a short pause in activity, snapshots the
  // state that came before the pause. This coalesces a whole drag or a burst
  // of typing into a single undo step instead of one step per pixel/keystroke,
  // without having to thread history calls through every individual setNodes
  // / setEdges call-site in the app.
  const undoStackRef = useRef([]);
  const redoStackRef = useRef([]);
  const lastSnapshotRef = useRef({ nodes: initialNodes, edges: initialEdges });
  const restoringRef = useRef(false);
  const historyTimerRef = useRef(null);
  const [canUndo, setCanUndo] = useState(false);
  const [canRedo, setCanRedo] = useState(false);

  useEffect(() => {
    if (restoringRef.current) {
      restoringRef.current = false;
      lastSnapshotRef.current = { nodes, edges };
      return;
    }
    if (historyTimerRef.current) clearTimeout(historyTimerRef.current);
    historyTimerRef.current = setTimeout(() => {
      undoStackRef.current.push(lastSnapshotRef.current);
      if (undoStackRef.current.length > 100) undoStackRef.current.shift();
      redoStackRef.current = [];
      lastSnapshotRef.current = { nodes, edges };
      setCanUndo(true);
      setCanRedo(false);
    }, 400);
    return () => { if (historyTimerRef.current) clearTimeout(historyTimerRef.current); };
  }, [nodes, edges]);

  const undo = useCallback(() => {
    if (historyTimerRef.current) { clearTimeout(historyTimerRef.current); historyTimerRef.current = null; }
    if (!undoStackRef.current.length) return;
    const prev = undoStackRef.current.pop();
    redoStackRef.current.push(lastSnapshotRef.current);
    restoringRef.current = true;
    lastSnapshotRef.current = prev;
    setNodes(prev.nodes);
    setEdges(prev.edges);
    setCanUndo(undoStackRef.current.length > 0);
    setCanRedo(true);
  }, []);

  const redo = useCallback(() => {
    if (!redoStackRef.current.length) return;
    const next = redoStackRef.current.pop();
    undoStackRef.current.push(lastSnapshotRef.current);
    restoringRef.current = true;
    lastSnapshotRef.current = next;
    setNodes(next.nodes);
    setEdges(next.edges);
    setCanUndo(true);
    setCanRedo(redoStackRef.current.length > 0);
  }, []);

  const DEFAULT_ZOOM = 0.62;
  const [pan, setPan] = useState({ x: 40, y: 20 - DEFAULT_ZOOM * TOP_PAD });
  const [zoom, setZoom] = useState(DEFAULT_ZOOM);
  const [showHelp, setShowHelp] = useState(true);
  const [activeRoles, setActiveRoles] = useState([]);
  const [showKPI, setShowKPI] = useState(true);
  const [showMiniMap, setShowMiniMap] = useState(true);
  const [demoPlaying, setDemoPlaying] = useState(false);
  const [demoIndex, setDemoIndex] = useState(-1);
  const [commentDraft, setCommentDraft] = useState("");
  const [connectDrag, setConnectDrag] = useState(null); // { fromId, fromSide, x, y, hoverTargetId } while dragging a new connector from an anchor dot

  // ---------------- Jira dashboard state ----------------
  const [showJiraPanel, setShowJiraPanel] = useState(false);
  const [jiraTab, setJiraTab] = useState("connect"); // connect | burn | team
  const [jiraConfig, setJiraConfig] = useState({
    baseUrl: "", email: "", token: "", jql: "", pointsField: "customfield_10016", remember: false,
  });
  const [jiraIssues, setJiraIssues] = useState([]);
  const [jiraLoading, setJiraLoading] = useState(false);
  const [jiraError, setJiraError] = useState("");
  const [jiraInfo, setJiraInfo] = useState("");
  const [jiraGranularity, setJiraGranularity] = useState("day"); // day | week
  const jiraFileInputRef = useRef(null);

  useEffect(() => {
    try {
      const saved = localStorage.getItem("jiraFlowConfig");
      if (saved) setJiraConfig((c) => ({ ...c, ...JSON.parse(saved) }));
    } catch (err) { /* ignore — nothing saved yet, or storage unavailable */ }
  }, []);

  const persistJiraConfig = (cfg) => {
    try {
      if (cfg.remember) localStorage.setItem("jiraFlowConfig", JSON.stringify(cfg));
      else localStorage.removeItem("jiraFlowConfig");
    } catch (err) { /* private browsing / storage disabled — safe to ignore */ }
  };

  const fetchJiraIssues = async () => {
    const { baseUrl, email, token, jql, pointsField } = jiraConfig;
    if (!baseUrl.trim() || !email.trim() || !token.trim() || !jql.trim()) {
      setJiraError("Fill in Base URL, email, API token, and a JQL query first.");
      return;
    }
    setJiraLoading(true);
    setJiraError("");
    setJiraInfo("");
    persistJiraConfig(jiraConfig);
    const cleanBase = baseUrl.trim().replace(/\/+$/, "");
    const auth = "Basic " + btoa(`${email.trim()}:${token.trim()}`);
    const fields = ["summary", "status", "assignee", "created", "updated", "resolutiondate", pointsField].join(",");
    let startAt = 0;
    const maxResults = 100;
    let all = [];
    try {
      // eslint-disable-next-line no-constant-condition
      while (true) {
        const url = `${cleanBase}/rest/api/3/search?jql=${encodeURIComponent(jql)}&startAt=${startAt}&maxResults=${maxResults}&fields=${encodeURIComponent(fields)}`;
        const res = await fetch(url, { headers: { Authorization: auth, Accept: "application/json" } });
        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`HTTP ${res.status} ${res.statusText}${text ? " — " + text.slice(0, 200) : ""}`);
        }
        const data = await res.json();
        all = all.concat(data.issues || []);
        startAt += maxResults;
        if (startAt >= (data.total || 0) || !(data.issues || []).length || all.length > 3000) break;
      }
      setJiraIssues(all.map((iss) => jiraIssueFromApi(iss, pointsField)));
      setJiraInfo(`Loaded ${all.length} issue${all.length === 1 ? "" : "s"} from Jira just now.`);
      setJiraTab("burn");
    } catch (err) {
      setJiraError(
        "Couldn't reach Jira directly from the browser (" + err.message + "). This is almost always a CORS block — " +
        "Jira Cloud won't answer authenticated requests from another origin's JS by design. Run the small local proxy " +
        "(proxy-server.js, included alongside this file) and point Base URL at it — e.g. http://localhost:8787 — " +
        "or use \"Import JSON export\" below instead."
      );
    } finally {
      setJiraLoading(false);
    }
  };

  const importJiraJSON = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const issuesRaw = Array.isArray(data) ? data : (data.issues || []);
        const parsed = issuesRaw.map((iss) => (iss.fields ? jiraIssueFromApi(iss, jiraConfig.pointsField) : jiraIssueFromFlat(iss)));
        setJiraIssues(parsed);
        setJiraInfo(`Loaded ${parsed.length} issue${parsed.length === 1 ? "" : "s"} from file.`);
        setJiraError("");
        setJiraTab("burn");
      } catch (err) {
        setJiraError("Couldn't parse that file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };


  const viewportRef = useRef(null);
  const dragRef = useRef(null); // {id, offX, offY} or {panning:true, startX,startY,startPan} or {connecting:true, fromId, fromSide}
  const dragMovedRef = useRef(false); // tracks whether a mousedown->mouseup on a node was a real drag (vs. a plain click that should pop the details modal)
  const fileInputRef = useRef(null);
  // Single-click opens a full-screen modal backdrop, which then covers the
  // node itself — so the second mousedown of a real double-click lands on the
  // backdrop instead of the shape, and the browser never fires a native
  // "dblclick" event on the node. To make double-click work reliably, clicks
  // are timed by hand: a click is held for a short window before it opens the
  // single-click pop-up, and if a second click on the same node arrives
  // inside that window it's treated as a double-click instead.
  const clickTimerRef = useRef(null);
  const lastClickRef = useRef({ id: null, time: 0 });
  const DBLCLICK_MS = 320;

  // Converts a screen point into "node space" — the same coordinate system used by
  // node.x/node.y everywhere else in the app — even though the underlying SVG canvas
  // is padded with TOP_PAD of extra headroom above the content (see TOP_PAD above).
  const getInnerPoint = useCallback((clientX, clientY) => {
    const rect = viewportRef.current.getBoundingClientRect();
    return {
      x: (clientX - rect.left - pan.x) / zoom,
      y: (clientY - rect.top - pan.y) / zoom - TOP_PAD,
    };
  }, [pan, zoom]);


  const onAnchorMouseDown = (nodeId, side, e) => {
    e.stopPropagation();
    if (!editMode) return;
    const p = getInnerPoint(e.clientX, e.clientY);
    dragRef.current = { connecting: true, fromId: nodeId, fromSide: side };
    setConnectDrag({ fromId: nodeId, fromSide: side, x: p.x, y: p.y, hoverTargetId: null });
    setSelectedId(null);
    setSelectedEdgeId(null);
  };

  const onNodeMouseDown = (e, node) => {
    e.stopPropagation();
    if (connectMode) return;
    dragMovedRef.current = false;
    if (!editMode) {
      // View mode: selection highlight only (no pop-ups, no dragging/moving of shapes).
      setSelectedId(node.id);
      setSelectedIds([]);
      setSelectedEdgeId(null);
      return;
    }
    const p = getInnerPoint(e.clientX, e.clientY);

    // Shift/Ctrl+mousedown toggles multi-select membership instead of starting a drag.
    if (e.shiftKey || e.metaKey || e.ctrlKey) {
      setSelectedIds((ids) => (ids.includes(node.id) ? ids.filter((id) => id !== node.id) : ids.concat([node.id])));
      setSelectedId(node.id);
      setSelectedEdgeId(null);
      setPopupOpen(true);
      return;
    }

    // Figure out which nodes should move together with this one:
    // - if it belongs to a saved group, every node in that group;
    // - else if it's part of the current multi-selection, the whole selection;
    // - otherwise, just itself.
    let moveIds;
    if (node.groupId) {
      moveIds = nodes.filter((n) => n.groupId === node.groupId).map((n) => n.id);
    } else if (selectedIds.includes(node.id) && selectedIds.length > 1) {
      moveIds = selectedIds;
    } else {
      moveIds = [node.id];
    }
    setSelectedIds(moveIds.length > 1 ? moveIds : []);

    const offsets = {};
    nodes.forEach((n) => { if (moveIds.includes(n.id)) offsets[n.id] = { offX: p.x - n.x, offY: p.y - n.y }; });
    dragRef.current = { ids: moveIds, offsets, startClientX: e.clientX, startClientY: e.clientY };
    setSelectedId(node.id);
    setSelectedEdgeId(null);
    // Un-pin any connectors touching a moving tile so they auto-redraw and stay attached.
    setEdges((eds) => eds.map((ed) => (moveIds.includes(ed.from) || moveIds.includes(ed.to) ? { ...ed, waypoints: null } : ed)));
  };

  const openStoryModal = (node) => {
    setSelectedId(node.id);
    setSelectedIds([]);
    setSelectedEdgeId(null);
    setPopupOpen(false);
    setModalNodeId(node.id);
  };

  const onNodeClick = (e, node) => {
    e.stopPropagation();
    if (!editMode) return; // View mode: single click never opens a pop-up (selection highlight only, handled on mousedown).
    if (connectMode && editMode) {
      if (!connectSource) {
        setConnectSource(node.id);
      } else if (connectSource !== node.id) {
        setEdges((eds) => eds.concat([edge(connectSource, node.id, null, "")]));
        setConnectSource(null);
      }
      return;
    }
    if (dragMovedRef.current) return; // the tail end of a drag, not a genuine click

    const now = Date.now();
    if (lastClickRef.current.id === node.id && now - lastClickRef.current.time < DBLCLICK_MS) {
      // Second click on the same node within the window: treat it as a
      // double-click and skip opening the single-click pop-up entirely.
      if (clickTimerRef.current) { clearTimeout(clickTimerRef.current); clickTimerRef.current = null; }
      lastClickRef.current = { id: null, time: 0 };
      openStoryModal(node);
      return;
    }

    // First click: hold off opening the pop-up briefly in case a second
    // click follows (which would make this a double-click instead).
    lastClickRef.current = { id: node.id, time: now };
    if (clickTimerRef.current) clearTimeout(clickTimerRef.current);
    clickTimerRef.current = setTimeout(() => {
      clickTimerRef.current = null;
      setPopupOpen(true);
    }, DBLCLICK_MS);
  };

  const onNodeDouble = (e, node) => {
    e.stopPropagation();
    if (!editMode) return; // View mode: double click never opens the story modal.
    // Fallback for environments where a native dblclick does land cleanly on
    // the node (e.g. it fires before the pop-up timer above opens anything).
    if (clickTimerRef.current) { clearTimeout(clickTimerRef.current); clickTimerRef.current = null; }
    lastClickRef.current = { id: null, time: 0 };
    openStoryModal(node);
  };

  const onBackgroundMouseDown = (e) => {
    if (e.shiftKey) {
      const p = getInnerPoint(e.clientX, e.clientY);
      dragRef.current = { marquee: true, x1: p.x, y1: p.y };
      setMarquee({ x1: p.x, y1: p.y, x2: p.x, y2: p.y });
      return;
    }
    dragRef.current = { panning: true, startX: e.clientX, startY: e.clientY, startPan: pan };
    setSelectedId(null);
    setSelectedIds([]);
    setSelectedEdgeId(null);
    setPopupOpen(false);
  };

  useEffect(() => {
    const onMove = (e) => {
      const d = dragRef.current;
      if (!d) return;
      if (d.panning) {
        setPan({ x: d.startPan.x + (e.clientX - d.startX), y: d.startPan.y + (e.clientY - d.startY) });
      } else if (d.marquee) {
        const p = getInnerPoint(e.clientX, e.clientY);
        setMarquee({ x1: d.x1, y1: d.y1, x2: p.x, y2: p.y });
      } else if (d.connecting) {
        const p = getInnerPoint(e.clientX, e.clientY);
        const hover = nodes.find((n) => n.id !== d.fromId && p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h);
        const hoverSide = hover ? nearestSide(hover, p) : null;
        setConnectDrag((cd) => (cd ? { ...cd, x: p.x, y: p.y, hoverTargetId: hover ? hover.id : null, hoverSide } : cd));
      } else if (d.ids) {
        if (!dragMovedRef.current && (Math.abs(e.clientX - d.startClientX) > 4 || Math.abs(e.clientY - d.startClientY) > 4)) {
          dragMovedRef.current = true;
        }
        const p = getInnerPoint(e.clientX, e.clientY);
        setNodes((nds) => nds.map((n) => {
          const off = d.offsets[n.id];
          return off ? { ...n, x: Math.round(p.x - off.offX), y: Math.round(p.y - off.offY) } : n;
        }));
      }
    };
    const onUp = (e) => {
      const d = dragRef.current;
      if (d && d.connecting) {
        const p = getInnerPoint(e.clientX, e.clientY);
        const target = nodes.find((n) => n.id !== d.fromId && p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h);
        if (target) {
          // Both anchors are now explicit: the side the user dragged FROM
          // (d.fromSide) and the single nearest side to where they released
          // the mouse on the target (toSide). This is what makes e.g.
          // "top of A" -> "west of B" connect exactly there instead of
          // being recomputed from the shapes' relative positions.
          const toSide = nearestSide(target, p);
          setEdges((eds) => eds.concat([edge(d.fromId, target.id, null, "", d.fromSide, toSide)]));
          setSelectedEdgeId(null);
          setSelectedId(null);
          setPopupOpen(false);
        }
        setConnectDrag(null);
      }
      if (d && d.marquee) {
        setMarquee((m) => {
          if (m) {
            const minX = Math.min(m.x1, m.x2), maxX = Math.max(m.x1, m.x2);
            const minY = Math.min(m.y1, m.y2), maxY = Math.max(m.y1, m.y2);
            const hit = nodes.filter((n) => n.x < maxX && n.x + n.w > minX && n.y < maxY && n.y + n.h > minY).map((n) => n.id);
            setSelectedIds(hit);
            setSelectedId(hit.length ? hit[hit.length - 1] : null);
            setSelectedEdgeId(null);
            setPopupOpen(hit.length > 0);
          }
          return null;
        });
      }
      dragRef.current = null;
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, [getInnerPoint, nodes]);

  const commitEdit = () => {
    if (editingId) {
      setNodes((nds) => nds.map((n) => (n.id === editingId ? { ...n, text: draftText } : n)));
    }
    setEditingId(null);
  };

  const addShape = (type) => {
    if (!editMode) return;
    const rect = viewportRef.current.getBoundingClientRect();
    const cx = (rect.width / 2 - pan.x) / zoom;
    const cy = (rect.height / 2 - pan.y) / zoom;
    const dims =
      type === "decision" ? { w: 170, h: 110 } :
      type === "terminal" ? { w: 170, h: 54 } :
      type === "note" ? { w: 190, h: 60 } :
      type === "io" ? { w: 190, h: 70 } :
      type === "document" ? { w: 190, h: 74 } :
      type === "predefined" ? { w: 190, h: 70 } :
      type === "database" ? { w: 150, h: 90 } :
      type === "connector" ? { w: 60, h: 60 } :
      { w: 180, h: 64 };
    const n = defaultNode({ type, x: Math.round(cx - dims.w / 2), y: Math.round(cy - dims.h / 2), w: dims.w, h: dims.h, text: "New step" });
    setNodes((nds) => nds.concat([n]));
    setSelectedId(n.id);
    setEditingId(n.id);
    setDraftText(n.text);
  };

  const deleteSelected = () => {
    if (!editMode) return;
    const ids = selectedIds.length ? selectedIds : (selectedId ? [selectedId] : []);
    if (ids.length) {
      setNodes((nds) => nds.filter((n) => !ids.includes(n.id)));
      setEdges((eds) => eds.filter((ed) => !ids.includes(ed.from) && !ids.includes(ed.to)));
      setSelectedId(null);
      setSelectedIds([]);
    }
    if (selectedEdgeId) {
      setEdges((eds) => eds.filter((ed) => ed.id !== selectedEdgeId));
      setSelectedEdgeId(null);
    }
    setPopupOpen(false);
  };

  const duplicateSelected = () => {
    if (!editMode) return;
    const ids = selectedIds.length ? selectedIds : (selectedId ? [selectedId] : []);
    if (!ids.length) return;
    const idMap = {};
    ids.forEach((id) => { idMap[id] = uid("n"); });
    const anyGrouped = ids.some((id) => nodes.find((n) => n.id === id)?.groupId);
    const newGroupId = ids.length > 1 ? uid("grp") : null;
    const copies = nodes.filter((n) => ids.includes(n.id)).map((orig) => ({
      ...orig,
      id: idMap[orig.id],
      x: orig.x + 32,
      y: orig.y + 32,
      groupId: newGroupId,
      comments: (orig.comments || []).slice(),
      raci: { ...(orig.raci || {}) },
    }));
    // Recreate internal edges (both endpoints inside the duplicated set) so the copy stays wired together.
    const internalEdgeCopies = edges
      .filter((ed) => idMap[ed.from] && idMap[ed.to])
      .map((ed) => edge(idMap[ed.from], idMap[ed.to], null, ed.label || ""));
    setNodes((nds) => nds.concat(copies));
    setEdges((eds) => eds.concat(internalEdgeCopies));
    setSelectedIds(copies.length > 1 ? copies.map((c) => c.id) : []);
    setSelectedId(copies[copies.length - 1]?.id || null);
    setSelectedEdgeId(null);
  };

  const groupSelected = () => {
    if (!editMode || selectedIds.length < 2) return;
    const gid = uid("grp");
    setNodes((nds) => nds.map((n) => (selectedIds.includes(n.id) ? { ...n, groupId: gid } : n)));
  };

  const ungroupSelected = () => {
    if (!editMode) return;
    const ids = selectedIds.length ? selectedIds : (selectedId ? [selectedId] : []);
    if (!ids.length) return;
    const groupIds = new Set(nodes.filter((n) => ids.includes(n.id) && n.groupId).map((n) => n.groupId));
    setNodes((nds) => nds.map((n) => (groupIds.has(n.groupId) ? { ...n, groupId: null } : n)));
  };

  const toggleRole = (r) => {
    setActiveRoles((arr) => (arr.includes(r) ? arr.filter((x) => x !== r) : arr.concat([r])));
  };

  const roleActive = activeRoles.length > 0;

  const isRoleMatch = (n) =>
    !roleActive || activeRoles.some((r) => (n.role || "").toLowerCase().includes(r.toLowerCase()));

  const isDimmed = (n) => {
    if (demoPlaying || demoIndex >= 0) return DEMO_SEQUENCE[demoIndex] !== n.id;
    if (!roleActive) return false;
    return !isRoleMatch(n);
  };

  const isSpotlight = (n) => {
    if (demoPlaying || demoIndex >= 0) return DEMO_SEQUENCE[demoIndex] === n.id;
    if (!roleActive) return false;
    return isRoleMatch(n);
  };

  // ---------------- Demo Mode ----------------
  const startDemo = () => {
    setSelectedId(null); setSelectedEdgeId(null); setConnectMode(false);
    setDemoIndex(0); setDemoPlaying(true);
  };
  const stopDemo = () => { setDemoPlaying(false); setDemoIndex(-1); resetView(); };

  useEffect(() => {
    if (!demoPlaying) return;
    const t = setTimeout(() => {
      setDemoIndex((i) => {
        if (i >= DEMO_SEQUENCE.length - 1) { setDemoPlaying(false); return i; }
        return i + 1;
      });
    }, 1700);
    return () => clearTimeout(t);
  }, [demoPlaying, demoIndex]);

  useEffect(() => {
    if (demoIndex < 0 || !viewportRef.current) return;
    const n = nodes.find((nd) => nd.id === DEMO_SEQUENCE[demoIndex]);
    if (!n) return;
    const rect = viewportRef.current.getBoundingClientRect();
    const targetZoom = 0.85;
    const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    setZoom(targetZoom);
    setPan({ x: rect.width / 2 - cx * targetZoom, y: rect.height / 2 - (cy + TOP_PAD) * targetZoom });
  }, [demoIndex]);

  const onMiniMapNavigate = (canvasX, canvasY) => {
    if (!viewportRef.current) return;
    const rect = viewportRef.current.getBoundingClientRect();
    setPan({ x: rect.width / 2 - canvasX * zoom, y: rect.height / 2 - (canvasY + TOP_PAD) * zoom });
  };

  const addComment = () => {
    if (!commentDraft.trim() || !modalNodeId) return;
    setNodes((nds) => nds.map((n) => (n.id === modalNodeId
      ? { ...n, comments: (n.comments || []).concat([{ author: "You", text: commentDraft.trim(), time: "Just now" }]) }
      : n)));
    setCommentDraft("");
  };

  useEffect(() => {
    const onKey = (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === "z" && !e.shiftKey) {
        e.preventDefault();
        undo();
        return;
      }
      if (mod && ((e.key.toLowerCase() === "z" && e.shiftKey) || e.key.toLowerCase() === "y")) {
        e.preventDefault();
        redo();
        return;
      }
      if ((e.key === "Delete" || e.key === "Backspace") && !editingId && !modalNodeId && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") {
        deleteSelected();
      }
      if (e.key === "Escape") {
        setConnectMode(false);
        setConnectSource(null);
        setEditingId(null);
        setModalNodeId(null);
        setPopupOpen(false);
        if (connectDrag) { dragRef.current = null; setConnectDrag(null); }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({ nodes, edges }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "epic-config-flow.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const importJSON = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data.nodes) && Array.isArray(data.edges)) {
          setNodes(data.nodes);
          setEdges(data.edges);
          setSelectedId(null);
          setSelectedEdgeId(null);
        } else {
          alert("This file doesn't look like a flowchart export.");
        }
      } catch (err) {
        alert("Couldn't read that file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const exportPNG = () => {
    setEditingId(null);
    setSelectedId(null);
    setSelectedEdgeId(null);
    setTimeout(() => {
      if (!nodes.length) { alert("Nothing to export yet — add a shape first."); return; }

      // Export only the actual content's bounding box (plus a margin), not the whole
      // virtual canvas — the full canvas is far larger than browsers allow a <canvas>
      // to be, which was producing corrupt/undecodable PNG files.
      const pad = 60;
      const minX = Math.min(...nodes.map((n) => n.x)) - pad;
      const minY = Math.min(...nodes.map((n) => n.y)) - pad;
      const maxX = Math.max(...nodes.map((n) => n.x + n.w)) + pad;
      const maxY = Math.max(...nodes.map((n) => n.y + n.h)) + pad;
      const boxW = maxX - minX;
      const boxH = maxY - minY;

      const svgEl = document.getElementById("flow-svg");
      const clone = svgEl.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("viewBox", `${minX} ${minY} ${boxW} ${boxH}`);
      clone.setAttribute("width", boxW);
      clone.setAttribute("height", boxH);
      clone.style.background = "#FFFFFF";
      const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bg.setAttribute("x", minX); bg.setAttribute("y", minY);
      bg.setAttribute("width", boxW); bg.setAttribute("height", boxH);
      bg.setAttribute("fill", "#FFFFFF");
      clone.insertBefore(bg, clone.firstChild);

      const xml = new XMLSerializer().serializeToString(clone);
      const svg64 = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onerror = () => alert("Couldn't render the PNG preview. Please try again.");
      img.onload = () => {
        // Cap the raster size so we stay well within browser <canvas> pixel limits.
        const MAX_DIM = 4000;
        const outScale = Math.min(2, MAX_DIM / Math.max(boxW, boxH));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(boxW * outScale));
        canvas.height = Math.max(1, Math.round(boxH * outScale));
        const ctx = canvas.getContext("2d");
        ctx.scale(outScale, outScale);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, boxW, boxH);
        ctx.drawImage(img, 0, 0, boxW, boxH);
        canvas.toBlob((blob) => {
          if (!blob) { alert("Couldn't generate the PNG — please try again."); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.download = "epic-config-flow.png";
          a.href = url;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
      };
      img.src = svg64;
    }, 50);
  };

  // Changes zoom while keeping whatever is currently centered in the viewport
  // centered after the change. Needed because pan/zoom interact multiplicatively
  // with the padded canvas (TOP_PAD) — changing zoom without correcting pan
  // throws the content far off-screen.
  const zoomAt = (newZoomRaw) => {
    const newZoom = Math.max(0.3, Math.min(2, +newZoomRaw.toFixed(2)));
    if (!viewportRef.current) { setZoom(newZoom); return; }
    const rect = viewportRef.current.getBoundingClientRect();
    const cxScreen = rect.width / 2, cyScreen = rect.height / 2;
    const bx = (cxScreen - pan.x) / zoom;
    const by = (cyScreen - pan.y) / zoom;
    setZoom(newZoom);
    setPan({ x: cxScreen - bx * newZoom, y: cyScreen - by * newZoom });
  };

  const resetView = () => { setZoom(DEFAULT_ZOOM); setPan({ x: 40, y: 20 - DEFAULT_ZOOM * TOP_PAD }); };

  const modalNode = nodes.find((n) => n.id === modalNodeId);
  const selEdge = edges.find((e2) => e2.id === selectedEdgeId);
  const selNode = nodes.find((n) => n.id === selectedId);

  const stageNodes = nodes.filter((n) => n.type === "process");
  const kpi = { "Not started": 0, "In Progress": 0, "Blocked": 0, "In Review": 0, "Done": 0 };
  stageNodes.forEach((n) => { kpi[n.status] = (kpi[n.status] || 0) + 1; });
  const kpiTotal = stageNodes.length || 1;
  const completionPct = Math.round(((kpi["Done"] || 0) / kpiTotal) * 100);

  // One pass that computes every connector's route and then nudges apart any
  // segments that would otherwise overlap, so lines stay visually distinct
  // no matter how the shapes are arranged.
  const edgeRoutes = useMemo(() => {
    const routes = edges.map((ed) => {
      const from = nodes.find((n) => n.id === ed.from);
      const to = nodes.find((n) => n.id === ed.to);
      if (!from || !to) return null;
      const raw = ed.waypoints && ed.waypoints.length
        ? ed.waypoints
        : (ed.fromSide && ed.toSide ? routeSides(from, ed.fromSide, to, ed.toSide) : autoRoute(from, to));
      return { ed, from, to, pts: raw.map((p) => [p[0], p[1]]) };
    });
    return deconflictRoutes(routes.filter(Boolean));
  }, [edges, nodes]);

  return (
    <div className="app-root">
      <header className="topbar">
        <div className="brand-row">
          <div className="brand-title">Jira Flow</div>
          <div className="brand-sub">
            {editMode
              ? "Edit mode · drag, connect, or delete shapes · hover a shape for connect anchors"
              : "View mode · click a shape to inspect it · switch to Edit to change the diagram"}
          </div>
        </div>
        <div className="toolbar">
          <div className="toolbar-row">
            <div className="tool-group">
              <button
                className={`mode-toggle ${editMode ? "edit" : "view"}`}
                onClick={() => { setEditMode((v) => !v); setConnectMode(false); setConnectSource(null); }}
                title="Toggle between read-only viewing and editing the diagram"
              >
                {editMode ? "✏ Edit Mode" : "🔒 View Mode"}
              </button>
            </div>

            {editMode && (
              <div className="tool-group">
                <span className="tool-label">Shapes</span>
                <button onClick={() => addShape("process")} title="Add process step">▢ Process</button>
                <button onClick={() => addShape("decision")} title="Add decision">◇ Decision</button>
                <button onClick={() => addShape("terminal")} title="Add start/end">⬡ Start/End</button>
                <button onClick={() => addShape("note")} title="Add note">✐ Note</button>
                <button onClick={() => addShape("io")} title="Add data / input-output (parallelogram)">▱ Data</button>
                <button onClick={() => addShape("document")} title="Add document">📄 Document</button>
                <button onClick={() => addShape("predefined")} title="Add predefined process / subroutine">⧉ Sub-process</button>
                <button onClick={() => addShape("database")} title="Add database / data store">🛢 Database</button>
                <button onClick={() => addShape("connector")} title="Add on-page connector">◯ Connector</button>
              </div>
            )}
            {editMode && (
              <div className="tool-group">
                <button
                  className={connectMode ? "active" : ""}
                  onClick={() => { setConnectMode((v) => !v); setConnectSource(null); }}
                  title="Connect two steps with an arrow"
                >
                  ↗ {connectMode ? "Connecting… (Esc to stop)" : "Connect"}
                </button>
                <button onClick={deleteSelected} disabled={!selectedId && !selectedIds.length && !selectedEdgeId} title="Delete selected">🗑 Delete</button>
              </div>
            )}
            {editMode && (
              <div className="tool-group">
                <button onClick={undo} disabled={!canUndo} title="Undo (Ctrl/Cmd+Z)">↶ Undo</button>
                <button onClick={redo} disabled={!canRedo} title="Redo (Ctrl/Cmd+Shift+Z)">↷ Redo</button>
              </div>
            )}
            {editMode && (
              <div className="tool-group">
                <span className="tool-label">Group</span>
                <button onClick={groupSelected} disabled={selectedIds.length < 2} title="Group the selected steps so they move together">⛓ Group</button>
                <button onClick={ungroupSelected} disabled={!selectedIds.length && !selectedId} title="Ungroup the selected steps">✂ Ungroup</button>
                <button onClick={duplicateSelected} disabled={!selectedId && !selectedIds.length} title="Duplicate the selection (Ctrl/Cmd+click to multi-select, Shift+drag empty canvas to marquee-select)">⎘ Duplicate</button>
              </div>
            )}

            <div className="tool-group">
              <span className="tool-label">Roles</span>
              {PERSONAS.map((p) => (
                <button
                  key={p}
                  className={`chip-btn ${activeRoles.includes(p) ? "active" : ""}`}
                  onClick={() => toggleRole(p)}
                  title={`Highlight ${p}`}
                >{p}</button>
              ))}
            </div>

            <div className="tool-group">
              <button onClick={() => zoomAt(zoom - 0.1)}>−</button>
              <span className="zoom-readout">{Math.round(zoom * 100)}%</span>
              <button onClick={() => zoomAt(zoom + 0.1)}>+</button>
              <button onClick={resetView}>Reset view</button>
            </div>

            <div className="tool-group">
              <button className={showMiniMap ? "active" : ""} onClick={() => setShowMiniMap((v) => !v)} title="Toggle mini-map">🗺 Map</button>
              <button className={showKPI ? "active" : ""} onClick={() => setShowKPI((v) => !v)} title="Toggle KPI dashboard">📊 KPI</button>
              <button className={showJiraPanel ? "active" : ""} onClick={() => setShowJiraPanel(true)} title="Jira burndown/burnup & team stats">📈 Jira Dashboard</button>
            </div>
            <div className="tool-group">
              {!demoPlaying && demoIndex < 0 && <button onClick={startDemo} title="Animate the whole epic lifecycle">▶ Demo Mode</button>}
              {demoPlaying && <button className="active" onClick={() => setDemoPlaying(false)} title="Pause">⏸ Pause</button>}
              {!demoPlaying && demoIndex >= 0 && <button onClick={() => setDemoPlaying(true)} title="Resume">▶ Resume</button>}
              {demoIndex >= 0 && <button onClick={stopDemo} title="Stop demo">■ Stop</button>}
              {demoIndex >= 0 && (
                <span className="zoom-readout" style={{ minWidth: 130 }}>
                  {`Step ${demoIndex + 1}/${DEMO_SEQUENCE.length}`}
                </span>
              )}
            </div>
            <div className="tool-group">
              <button onClick={exportPNG}>⬇ PNG</button>
              <button onClick={exportJSON}>⬇ Save JSON</button>
              <button onClick={() => fileInputRef.current.click()}>⬆ Load JSON</button>
              <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importJSON} />
            </div>
          </div>
        </div>
      </header>

      {showHelp && (
        <div className="help-strip">
          Double-click a step to open its Story details &middot; click once for a pop-up with color, duplicate, connect, or delete (click a connector line for the same, on that connector) &middot; Ctrl/Cmd+click or Shift+drag empty canvas to multi-select, then Group to keep them moving together &middot; drag empty space to pan &middot; drag a shape (or a grouped/multi-selected set) to move it (connectors stay attached, and dragging won't pop the details modal) &middot; hover a shape and drag from an anchor dot onto another shape to draw a new connector &middot; click the mini-map to jump around &middot; Ctrl/Cmd+Z to undo.
          <button className="dismiss" onClick={() => setShowHelp(false)}>✕</button>
        </div>
      )}

      <div className="stage">
        <div
          className="viewport"
          ref={viewportRef}
          onMouseDown={onBackgroundMouseDown}
        >
          <div className="inner" style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`, width: CANVAS_W, height: CANVAS_TOTAL_H }}>
            <svg id="flow-svg" width={CANVAS_W} height={CANVAS_TOTAL_H} viewBox={`0 ${-TOP_PAD} ${CANVAS_W} ${CANVAS_TOTAL_H}`}>
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M1,1 L9,5 L1,9" fill="none" stroke="#6B7280" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
                </marker>
              </defs>
              {edgeRoutes.map((route) => {
                const { ed, pts } = route;
                const d = pathFromPoints(pts);
                const mid = midOfPoints(pts);
                const isSel = selectedEdgeId === ed.id;
                return (
                  <g key={ed.id}>
                    <path d={d} fill="none" stroke="transparent" strokeWidth="14"
                      onClick={(e) => { e.stopPropagation(); setSelectedEdgeId(ed.id); setSelectedId(null); setSelectedIds([]); setPopupOpen(true); }}
                      style={{ cursor: "pointer" }} />
                    <path d={d} fill="none" stroke={isSel ? "#1868DB" : "#8791A0"} strokeWidth={isSel ? 2.6 : 1.8} markerEnd="url(#arrow)" style={{ pointerEvents: "none" }} />
                    {ed.label && (
                      <g style={{ pointerEvents: "none" }}>
                        <rect x={mid[0] - ed.label.length * 3.6 - 4} y={mid[1] - 10} width={ed.label.length * 7.2 + 8} height="16" fill="#FFFFFF" opacity="0.92" rx="3" />
                        <text x={mid[0]} y={mid[1] - 1} textAnchor="middle" fontSize="11" fill="#4B5563" fontFamily="Arial, sans-serif" fontStyle="italic">{ed.label}</text>
                      </g>
                    )}
                  </g>
                );
              })}
              {(() => {
                const groupIds = [...new Set(nodes.filter((n) => n.groupId).map((n) => n.groupId))];
                return groupIds.map((gid) => {
                  const members = nodes.filter((n) => n.groupId === gid);
                  if (!members.length) return null;
                  const minX = Math.min(...members.map((n) => n.x)) - 14;
                  const minY = Math.min(...members.map((n) => n.y)) - 14;
                  const maxX = Math.max(...members.map((n) => n.x + n.w)) + 14;
                  const maxY = Math.max(...members.map((n) => n.y + n.h)) + 14;
                  return (
                    <rect
                      key={gid}
                      x={minX} y={minY} width={maxX - minX} height={maxY - minY}
                      rx={14} fill="rgba(24,104,219,0.035)" stroke="#8791A0" strokeWidth="1.5" strokeDasharray="8,5"
                      style={{ pointerEvents: "none" }}
                    />
                  );
                });
              })()}
              {nodes.map((n) => (
                <NodeView
                  key={n.id}
                  node={n}
                  selected={selectedId === n.id || selectedIds.includes(n.id)}
                  connectSource={connectSource}
                  dimmed={isDimmed(n)}
                  spotlight={isSpotlight(n)}
                  demoActive={demoIndex >= 0}
                  dropTarget={!!connectDrag && connectDrag.hoverTargetId === n.id}
                  candidateSide={connectDrag && connectDrag.hoverTargetId === n.id ? connectDrag.hoverSide : null}
                  editMode={editMode}
                  onMouseDown={(e) => onNodeMouseDown(e, n)}
                  onClick={(e) => onNodeClick(e, n)}
                  onDoubleClick={(e) => onNodeDouble(e, n)}
                  onAnchorMouseDown={onAnchorMouseDown}
                />
              ))}
              {connectDrag && (() => {
                const fromNode = nodes.find((n) => n.id === connectDrag.fromId);
                if (!fromNode) return null;
                const [sx, sy] = anchorPoint(fromNode, connectDrag.fromSide);
                // Once hovering a valid target, preview the path snapped to the
                // exact candidate anchor rather than a straight line to the
                // cursor, so what you see is what you'll get on release.
                const target = connectDrag.hoverTargetId ? nodes.find((n) => n.id === connectDrag.hoverTargetId) : null;
                const d = target && connectDrag.hoverSide
                  ? pathFromPoints(routeSides(fromNode, connectDrag.fromSide, target, connectDrag.hoverSide))
                  : `M${sx},${sy} L${connectDrag.x},${connectDrag.y}`;
                return (
                  <path
                    d={d}
                    fill="none" stroke="#1868DB" strokeWidth="2.2" strokeDasharray="7,5"
                    style={{ pointerEvents: "none" }}
                  />
                );
              })()}
              {marquee && (
                <rect
                  x={Math.min(marquee.x1, marquee.x2)} y={Math.min(marquee.y1, marquee.y2)}
                  width={Math.abs(marquee.x2 - marquee.x1)} height={Math.abs(marquee.y2 - marquee.y1)}
                  fill="rgba(24,104,219,0.10)" stroke="#1868DB" strokeWidth="1.4" strokeDasharray="5,4"
                  style={{ pointerEvents: "none" }}
                />
              )}
            </svg>

            {showMiniMap && (
              <MiniMap nodes={nodes} pan={pan} zoom={zoom} viewportEl={viewportRef.current} onNavigate={onMiniMapNavigate} />
            )}

            {showKPI && (
              <div className="kpi-float panel-card">
                <div className="panel-title">KPI Dashboard</div>
                <div style={{ fontSize: 26, fontWeight: 800, color: "#1E7A47", marginBottom: 2 }}>{completionPct}%</div>
                <div style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 10 }}>Epic completion ({stageNodes.length} stages)</div>
                {["Done", "In Review", "In Progress", "Blocked", "Not started"].map((st) => (
                  <div key={st} style={{ marginBottom: 7 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, color: "#3C4451", marginBottom: 2 }}>
                      <span>{st}</span><span>{kpi[st] || 0}</span>
                    </div>
                    <div className="kpi-bar-track">
                      <div className="kpi-bar-fill" style={{ width: `${((kpi[st] || 0) / kpiTotal) * 100}%`, background: STATUS_COLOR[st] }} />
                    </div>
                  </div>
                ))}
              </div>
            )}

            {editingId && nodes.find((n) => n.id === editingId) && (() => {
              const n = nodes.find((n2) => n2.id === editingId);
              return (
                <textarea
                  autoFocus
                  className="edit-overlay"
                  style={{ left: n.x, top: n.y, width: n.w, height: n.h }}
                  value={draftText}
                  onChange={(e) => setDraftText(e.target.value)}
                  onMouseDown={(e) => e.stopPropagation()}
                  onBlur={commitEdit}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitEdit(); }
                  }}
                />
              );
            })()}
          </div>
        </div>
      </div>

      <datalist id="roleOptions">
        {PERSONAS.map((p) => <option key={p} value={p} />)}
      </datalist>

      {modalNode && (
        <div className="modal-backdrop" onClick={() => setModalNodeId(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-title">Story details</div>
            {!editMode && <div className="jira-status-line info">Viewing in read-only mode. Switch to Edit Mode to make changes.</div>}

            <fieldset disabled={!editMode} style={{ border: "none", padding: 0, margin: 0 }}>
            <label>Title / Step name</label>
            <input
              value={modalNode.text}
              onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, text: e.target.value } : n)))}
              placeholder="e.g. Review & approve"
            />

            <div className="modal-grid-2">
              <div>
                <label>Story ID</label>
                <input
                  value={modalNode.storyId}
                  onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, storyId: e.target.value } : n)))}
                  placeholder="e.g. CFG-101"
                />
              </div>
              <div>
                <label>Sprint</label>
                <input
                  value={modalNode.sprint}
                  onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, sprint: e.target.value } : n)))}
                  placeholder="e.g. Sprint 24.2"
                />
              </div>
            </div>

            <label>Owner</label>
            <input
              value={modalNode.person}
              onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, person: e.target.value } : n)))}
              placeholder="e.g. Priya Sharma"
            />

            <div className="modal-grid-2">
              <div>
                <label>Role / Team</label>
                <input
                  list="roleOptions"
                  value={modalNode.role}
                  onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, role: e.target.value } : n)))}
                  placeholder="e.g. Architect"
                />
              </div>
              <div>
                <label>Story Points</label>
                <input
                  value={modalNode.storyPoints}
                  onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, storyPoints: e.target.value } : n)))}
                  placeholder="e.g. 3"
                />
              </div>
            </div>

            <label>Status</label>
            <select
              value={modalNode.status}
              onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, status: e.target.value } : n)))}
            >
              {Object.keys(STATUS_COLOR).map((s) => <option key={s} value={s}>{s}</option>)}
            </select>

            <label>Acceptance Criteria</label>
            <textarea
              rows={2}
              value={modalNode.acceptanceCriteria}
              onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, acceptanceCriteria: e.target.value } : n)))}
              placeholder="What must be true for this stage to be considered done?"
            />

            <label>Dependencies</label>
            <input
              value={modalNode.dependencies}
              onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, dependencies: e.target.value } : n)))}
              placeholder="e.g. CR raised, Product Backlog groomed"
            />

            <label>RACI</label>
            <div className="modal-grid-4">
              {["r", "a", "c", "i"].map((k) => (
                <div key={k}>
                  <span className="raci-label">{k.toUpperCase()}</span>
                  <input
                    className="raci-input"
                    value={modalNode.raci[k]}
                    onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, raci: { ...n.raci, [k]: e.target.value } } : n)))}
                  />
                </div>
              ))}
            </div>

            <label>Notes / responsibilities</label>
            <textarea
              rows={3}
              value={modalNode.notes}
              onChange={(e) => setNodes((nds) => nds.map((n) => (n.id === modalNode.id ? { ...n, notes: e.target.value } : n)))}
              placeholder="What does this person/team need to do at this stage?"
            />

            <label>Comments</label>
            <div className="comment-list">
              {(modalNode.comments || []).length === 0 && <div className="panel-card muted" style={{ padding: 8, margin: 0 }}>No comments yet.</div>}
              {(modalNode.comments || []).map((c, i) => (
                <div key={i} className="comment-item">
                  <div className="comment-meta"><b>{c.author}</b> · {c.time}</div>
                  <div>{c.text}</div>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
              <input
                style={{ flex: 1 }}
                value={commentDraft}
                onChange={(e) => setCommentDraft(e.target.value)}
                placeholder="Add a comment…"
                onKeyDown={(e) => { if (e.key === "Enter") addComment(); }}
              />
              <button className="panel-btn" style={{ width: "auto" }} onClick={addComment}>Add</button>
            </div>
            </fieldset>

            <div className="modal-actions">
              <button className="panel-btn" onClick={() => setModalNodeId(null)}>Done</button>
            </div>
          </div>
        </div>
      )}

      {popupOpen && !modalNodeId && (selectedIds.length > 1 || selNode || selEdge) && (
        <div className="modal-backdrop" onClick={() => setPopupOpen(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            {selectedIds.length > 1 ? (
              <div>
                <div className="modal-title">{selectedIds.length} steps selected</div>
                {editMode ? (
                  <>
                    <div className="modal-step">Drag any one of them to move the whole selection. Group them to keep the set together after you click elsewhere.</div>
                    <button className="panel-btn" onClick={groupSelected}>⛓ Group selected</button>
                    <button className="panel-btn" onClick={ungroupSelected}>✂ Ungroup selected</button>
                    <button className="panel-btn" onClick={duplicateSelected}>⧉ Duplicate selection</button>
                    <button className="panel-btn danger" onClick={deleteSelected}>🗑 Delete selection</button>
                    <div className="panel-row" style={{ marginTop: 10 }}>
                      <span className="panel-label">Color (applies to all selected)</span>
                      <div className="palette-row">
                        <button
                          className="palette-swatch reset"
                          title="Use default color for this shape type"
                          onClick={() => setNodes((nds) => nds.map((n) => (selectedIds.includes(n.id) ? { ...n, color: null } : n)))}
                        >↺</button>
                        {NODE_PALETTE.map((c) => (
                          <button
                            key={c.name}
                            className="palette-swatch"
                            style={{ background: c.fill, borderColor: c.stroke }}
                            title={c.name}
                            onClick={() => setNodes((nds) => nds.map((n) => (selectedIds.includes(n.id) ? { ...n, color: { fill: c.fill, stroke: c.stroke, text: c.text } } : n)))}
                          />
                        ))}
                      </div>
                    </div>
                  </>
                ) : (
                  <div className="modal-step">Switch to Edit Mode to group, duplicate, recolor, or delete these steps.</div>
                )}
              </div>
            ) : selNode ? (
              <div>
                <div className="modal-title">Selected step</div>
                <div className="modal-step">{selNode.text}</div>
                <div className="panel-row">
                  <span className="status-chip" style={{ background: STATUS_COLOR[selNode.status] || "#9AA1AC" }}>{selNode.status}</span>
                </div>
                <button className="panel-btn" onClick={() => setModalNodeId(selNode.id)}>👤 Story details</button>
                {editMode && (
                  <>
                    <button className="panel-btn" onClick={() => { setEditingId(selNode.id); setDraftText(selNode.text); setPopupOpen(false); }}>✏ Edit</button>
                    <button className="panel-btn" onClick={duplicateSelected}>⧉ Duplicate step</button>
                    <button className="panel-btn" onClick={() => { setConnectMode(true); setConnectSource(selNode.id); setPopupOpen(false); }}>↗ Connect from here</button>
                    <button className="panel-btn danger" onClick={deleteSelected}>🗑 Delete step</button>

                    <div className="panel-row" style={{ marginTop: 10 }}>
                      <span className="panel-label">Color</span>
                      <div className="palette-row">
                        <button
                          className={`palette-swatch reset ${!selNode.color ? "selected" : ""}`}
                          title="Use default color for this shape type"
                          onClick={() => setNodes((nds) => nds.map((n) => (n.id === selNode.id ? { ...n, color: null } : n)))}
                        >↺</button>
                        {NODE_PALETTE.map((c) => (
                          <button
                            key={c.name}
                            className={`palette-swatch ${selNode.color && selNode.color.fill === c.fill ? "selected" : ""}`}
                            style={{ background: c.fill, borderColor: c.stroke }}
                            title={c.name}
                            onClick={() => setNodes((nds) => nds.map((n) => (n.id === selNode.id ? { ...n, color: { fill: c.fill, stroke: c.stroke, text: c.text } } : n)))}
                          />
                        ))}
                      </div>
                    </div>
                  </>
                )}
                {(selNode.storyId || selNode.sprint || selNode.storyPoints) && (
                  <div className="panel-row" style={{ marginTop: 10 }}>
                    {selNode.storyId && <span className="mini-chip">{selNode.storyId}</span>}
                    {selNode.sprint && <span className="mini-chip">{selNode.sprint}</span>}
                    {selNode.storyPoints && <span className="mini-chip">{selNode.storyPoints} pts</span>}
                  </div>
                )}
                {(selNode.person || selNode.role || selNode.notes || selNode.acceptanceCriteria || selNode.dependencies || (selNode.comments && selNode.comments.length)) && (
                  <div className="panel-meta">
                    {selNode.person && <div><b>Owner:</b> {selNode.person}</div>}
                    {selNode.role && <div><b>Role:</b> {selNode.role}</div>}
                    {selNode.notes && <div><b>Notes:</b> {selNode.notes}</div>}
                    {selNode.acceptanceCriteria && <div><b>AC:</b> {selNode.acceptanceCriteria}</div>}
                    {selNode.dependencies && <div><b>Dependencies:</b> {selNode.dependencies}</div>}
                    {selNode.comments && selNode.comments.length > 0 && <div><b>Comments:</b> {selNode.comments.length}</div>}
                  </div>
                )}
              </div>
            ) : selEdge ? (
              <div>
                <div className="modal-title">Selected connector</div>
                {editMode ? (
                  <>
                    <label className="panel-label">Label</label>
                    <input
                      className="panel-input"
                      value={selEdge.label}
                      onChange={(e) => setEdges((eds) => eds.map((ed2) => (ed2.id === selEdge.id ? { ...ed2, label: e.target.value } : ed2)))}
                      placeholder="e.g. Yes / No"
                    />
                    <button className="panel-btn danger" onClick={deleteSelected}>🗑 Delete connector</button>
                  </>
                ) : (
                  <>
                    {selEdge.label && <div className="modal-step">Label: {selEdge.label}</div>}
                    <div className="modal-step">Switch to Edit Mode to relabel or delete this connector.</div>
                  </>
                )}
              </div>
            ) : null}

            <div className="modal-actions">
              <button className="panel-btn" onClick={() => setPopupOpen(false)}>Close</button>
            </div>
          </div>
        </div>
      )}

      {showJiraPanel && (() => {
        const burn = computeBurnSeries(jiraIssues, jiraGranularity);
        const team = computeTeamStats(jiraIssues);
        return (
          <div className="modal-backdrop" onClick={() => setShowJiraPanel(false)}>
            <div className="modal modal-wide" onClick={(e) => e.stopPropagation()}>
              <div className="modal-title">Jira Dashboard</div>
              <div className="modal-step">Burndown / burnup and team progress, computed from real Jira issues.</div>

              <div className="jira-tabs">
                <button className={jiraTab === "connect" ? "active" : ""} onClick={() => setJiraTab("connect")}>⚙ Connect</button>
                <button className={jiraTab === "burn" ? "active" : ""} onClick={() => setJiraTab("burn")} disabled={!jiraIssues.length}>📉 Burndown / Burnup</button>
                <button className={jiraTab === "team" ? "active" : ""} onClick={() => setJiraTab("team")} disabled={!jiraIssues.length}>👥 Team Progress</button>
              </div>

              {jiraError && <div className="jira-status-line err">{jiraError}</div>}
              {jiraInfo && !jiraError && <div className="jira-status-line ok">{jiraInfo}</div>}

              {jiraTab === "connect" && (
                <div>
                  <div className="jira-status-line info">
                    Browser JS calling Jira Cloud directly usually hits a CORS block, since Jira won't answer
                    cross-origin authenticated requests by design. Two reliable options: run the tiny local proxy
                    included alongside this file and point Base URL at it (e.g. http://localhost:8787), or export
                    issues to a JSON file (via the proxy's /export endpoint, or curl/Postman) and import it below —
                    that path always works, no server needed.
                  </div>
                  <div className="jira-grid-3">
                    <div>
                      <label>Jira base URL</label>
                      <input
                        placeholder="https://yourcompany.atlassian.net"
                        value={jiraConfig.baseUrl}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, baseUrl: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>Account email</label>
                      <input
                        placeholder="you@company.com"
                        value={jiraConfig.email}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, email: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>API token</label>
                      <input
                        type="password"
                        placeholder="Jira API token"
                        value={jiraConfig.token}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, token: e.target.value }))}
                      />
                    </div>
                  </div>
                  <label>JQL query</label>
                  <input
                    placeholder='project = ABC AND sprint in openSprints() ORDER BY created ASC'
                    value={jiraConfig.jql}
                    onChange={(e) => setJiraConfig((c) => ({ ...c, jql: e.target.value }))}
                  />
                  <div className="jira-grid-3">
                    <div>
                      <label>Story points field id</label>
                      <input
                        placeholder="customfield_10016"
                        value={jiraConfig.pointsField}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, pointsField: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>&nbsp;</label>
                      <label style={{ display: "flex", alignItems: "center", gap: 6, fontWeight: 400, marginTop: 8 }}>
                        <input
                          type="checkbox"
                          style={{ width: "auto" }}
                          checked={jiraConfig.remember}
                          onChange={(e) => setJiraConfig((c) => ({ ...c, remember: e.target.checked }))}
                        />
                        Remember these settings in this browser (token stored in plain text locally)
                      </label>
                    </div>
                    <div>
                      <label>&nbsp;</label>
                      <button className="panel-btn" style={{ marginTop: 6 }} onClick={fetchJiraIssues} disabled={jiraLoading}>
                        {jiraLoading ? "Fetching…" : "⇩ Fetch from Jira"}
                      </button>
                    </div>
                  </div>

                  <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--border)" }}>
                    <label>Or import a JSON export (always works, no CORS/proxy needed)</label>
                    <button className="panel-btn" style={{ width: "auto" }} onClick={() => jiraFileInputRef.current.click()}>⬆ Import JSON export</button>
                    <input ref={jiraFileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importJiraJSON} />
                  </div>
                </div>
              )}

              {jiraTab === "burn" && (
                jiraIssues.length ? (
                  <div>
                    <div className="tool-group" style={{ marginBottom: 10 }}>
                      <span className="tool-label">Granularity</span>
                      <button className={jiraGranularity === "day" ? "active" : ""} onClick={() => setJiraGranularity("day")}>Day</button>
                      <button className={jiraGranularity === "week" ? "active" : ""} onClick={() => setJiraGranularity("week")}>Week</button>
                    </div>
                    <div className="jira-chart-box">
                      <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>Burndown — remaining points vs ideal</div>
                      <ChartCanvas
                        type="line"
                        height={220}
                        data={{
                          labels: burn.labels,
                          datasets: [
                            { label: "Remaining", data: burn.remaining, borderColor: "#B03A6B", backgroundColor: "rgba(176,58,107,0.12)", tension: 0.2, fill: true },
                            { label: "Ideal", data: burn.ideal, borderColor: "#9AA1AC", borderDash: [5, 5], pointRadius: 0, fill: false },
                          ],
                        }}
                        options={{ responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }}
                      />
                    </div>
                    <div className="jira-chart-box">
                      <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>Burnup — completed vs total scope</div>
                      <ChartCanvas
                        type="line"
                        height={220}
                        data={{
                          labels: burn.labels,
                          datasets: [
                            { label: "Total scope", data: burn.totalScope, borderColor: "#2F5FA8", backgroundColor: "rgba(47,95,168,0.08)", tension: 0.2, fill: true },
                            { label: "Completed", data: burn.completed, borderColor: "#1E7A47", backgroundColor: "rgba(30,122,71,0.15)", tension: 0.2, fill: true },
                          ],
                        }}
                        options={{ responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }}
                      />
                    </div>
                  </div>
                ) : <div className="jira-status-line info">Connect to Jira or import a JSON export first.</div>
              )}

              {jiraTab === "team" && (
                jiraIssues.length ? (
                  <div>
                    <div className="jira-chart-box">
                      <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 6 }}>Points completed by teammate</div>
                      <ChartCanvas
                        type="bar"
                        height={220}
                        data={{
                          labels: team.map((t) => t.assignee),
                          datasets: [
                            { label: "Done", data: team.map((t) => t.donePoints), backgroundColor: "#1E7A47" },
                            { label: "Remaining", data: team.map((t) => t.totalPoints - t.donePoints), backgroundColor: "#EAECEF" },
                          ],
                        }}
                        options={{ responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } } }}
                      />
                    </div>
                    <table className="jira-table">
                      <thead>
                        <tr><th>Teammate</th><th>Issues</th><th>Done</th><th>In progress</th><th>To do</th><th>Points done</th><th>Points total</th></tr>
                      </thead>
                      <tbody>
                        {team.map((t) => (
                          <tr key={t.assignee}>
                            <td>{t.assignee}</td>
                            <td>{t.totalCount}</td>
                            <td>{t.doneCount}</td>
                            <td>{t.inProgress}</td>
                            <td>{t.todo}</td>
                            <td>{t.donePoints}</td>
                            <td>{t.totalPoints}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : <div className="jira-status-line info">Connect to Jira or import a JSON export first.</div>
              )}

              <div className="modal-actions">
                <button className="panel-btn" onClick={() => setShowJiraPanel(false)}>Close</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
