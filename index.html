  };

  const testJiraProxy = async () => {
    setJiraProxyStatus("⏳ Testing…");
    try {
      const res = await fetch(`${JIRA_PROXY_URL}/health`, { signal: AbortSignal.timeout(6000) });
      const data = await res.json().catch(() => ({}));
      setJiraProxyStatus(res.ok && data.status === "ok" ? "✅ Proxy is up." : `⚠️ Proxy replied with HTTP ${res.status}.`);
    } catch (err) {
      setJiraProxyStatus(`❌ Couldn't reach the proxy (${err.message}).`);
    }
  };

  // Pages through {JIRA_PROXY_URL}/jira via nextPageToken until Jira stops
  // returning one, collecting every raw issue along the way.
  const fetchAllJiraIssuesViaProxy = async (jiraBase, auth, jql, fields) => {
    let all = [];
    let nextPageToken = null;
    do {
      const params = new URLSearchParams({
        jiraBase, auth, jql, fields, maxResults: "100",
        ...(nextPageToken ? { nextPageToken } : {}),
      });
      const res = await fetch(`${JIRA_PROXY_URL}/jira?${params}`, { signal: AbortSignal.timeout(20000) });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.errorMessages?.[0] || errBody.message || errBody.error || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const page = data.issues || [];
      all = all.concat(page);
      nextPageToken = data.nextPageToken || null;
      if (page.length < 100 || all.length > 3000) break;
    } while (nextPageToken);
    return all;
  };

  const fetchJiraIssues = async () => {
    const { baseUrl, email, token, jql, pointsField, startDateField, dueDateField, origEndDateField, sprintField, leadingTrackField, parentField } = jiraConfig;
    if (!baseUrl.trim() || !email.trim() || !token.trim() || !jql.trim()) {
      setJiraError("Fill in Base URL, email, API token, and a JQL query first.");
      return;
    }
    setJiraLoading(true);
    setJiraError("");
    setJiraInfo("");
    persistJiraConfig(jiraConfig);
    const cleanBase = baseUrl.trim().replace(/\/+$/, "");
    const auth = btoa(`${email.trim()}:${token.trim()}`); // worker turns this into "Authorization: Basic {auth}" server-side
    const fieldMap = { pointsField, startDateField, dueDateField, origEndDateField, sprintField, leadingTrackField, parentField };
    const fields = [
      "summary", "status", "assignee", "priority", "created", "updated", "resolutiondate",
      "issuetype", "components", "parent",
      ...Object.values(fieldMap).filter(Boolean), // skip any field id the user left blank
    ].join(",");
    try {
      const all = await fetchAllJiraIssuesViaProxy(cleanBase, auth, jql.trim(), fields);
      setJiraIssues(all.map((iss) => jiraIssueFromApi(iss, fieldMap)));
      setJiraInfo(`Loaded ${all.length} issue${all.length === 1 ? "" : "s"} from Jira just now (via proxy).`);
      setShowJiraPanel(false);
      setRibbonTab("data");
      setMetricsSubTab("gantt");
    } catch (err) {
      setJiraError(
        "Couldn't fetch from Jira via the proxy (" + err.message + "). Double-check the Jira base URL, " +
        "email, API token, and JQL above, and that the Cloudflare Worker at " + JIRA_PROXY_URL + " is deployed " +
        "and healthy (use \"Test proxy connection\" below) — or use \"Import JSON export\" instead."
      );
    } finally {
      setJiraLoading(false);
    }
  };

  const importJiraJSON = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const issuesRaw = Array.isArray(data) ? data : (data.issues || []);
        const parsed = issuesRaw.map((iss) => (iss.fields ? jiraIssueFromApi(iss, jiraConfig.pointsField) : jiraIssueFromFlat(iss)));
        setJiraIssues(parsed);
        setJiraInfo(`Loaded ${parsed.length} issue${parsed.length === 1 ? "" : "s"} from file.`);
        setJiraError("");
        setShowJiraPanel(false);
        setRibbonTab("data");
        setMetricsSubTab("gantt");
      } catch (err) {
        setJiraError("Couldn't parse that file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  // Downloads the current Connect-tab field values (base URL, email, token,
  // JQL, field ids, etc.) as a JSON file, so they can be re-imported later
  // instead of typed in by hand. Deliberately excludes only the local
  // "remember" UI toggle — everything else needed to connect is included.
  const downloadJiraConfig = () => {
    const { remember, ...configToSave } = jiraConfig;
    const blob = new Blob([JSON.stringify(configToSave, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "jira-connection-config.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  // Imports a previously-downloaded connection-settings JSON and fills the
  // Connect tab fields with it, so the user doesn't have to retype them.
  const importJiraConfig = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        setJiraConfig((c) => ({ ...c, ...parsed }));
        setJiraInfo("Connection settings loaded from file.");
        setJiraError("");
      } catch (err) {
        setJiraError("Couldn't parse that config file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };


  const viewportRef = useRef(null);
  const dragRef = useRef(null); // {id, offX, offY} or {panning:true, startX,startY,startPan} or {connecting:true, fromId, fromSide}
  const dragMovedRef = useRef(false); // tracks whether a mousedown->mouseup on a node was a real drag (vs. a plain click that should pop the details modal)
  const fileInputRef = useRef(null);
  // Single-click opens a full-screen modal backdrop, which then covers the
  // node itself — so the second mousedown of a real double-click lands on the
  // backdrop instead of the shape, and the browser never fires a native
  // "dblclick" event on the node. To make double-click work reliably, clicks
  // are timed by hand: a click is held for a short window before it opens the
  // single-click pop-up, and if a second click on the same node arrives
  // inside that window it's treated as a double-click instead.
  const clickTimerRef = useRef(null);
  const lastClickRef = useRef({ id: null, time: 0 });
  const DBLCLICK_MS = 320;

  // Converts a screen point into "node space" — the same coordinate system used by
  // node.x/node.y everywhere else in the app — even though the underlying SVG canvas
  // is padded with TOP_PAD of extra headroom above the content (see TOP_PAD above).
  const getInnerPoint = useCallback((clientX, clientY) => {
    const rect = viewportRef.current.getBoundingClientRect();
    return {
      x: (clientX - rect.left - pan.x) / zoom,
      y: (clientY - rect.top - pan.y) / zoom - TOP_PAD,
    };
  }, [pan, zoom]);


  const onAnchorMouseDown = (nodeId, side, e) => {
    e.stopPropagation();
    if (!editMode) return;
    const p = getInnerPoint(e.clientX, e.clientY);
    dragRef.current = { connecting: true, fromId: nodeId, fromSide: side };
    setConnectDrag({ fromId: nodeId, fromSide: side, x: p.x, y: p.y, hoverTargetId: null });
    setSelectedId(null);
    setSelectedEdgeId(null);
  };

  const onNodeMouseDown = (e, node) => {
    e.stopPropagation();
    if (connectMode) return;
    dragMovedRef.current = false;
    if (!editMode) {
      // View mode: selection highlight only (no pop-ups, no dragging/moving of shapes).
      setSelectedId(node.id);
      setSelectedIds([]);
      setSelectedEdgeId(null);
      return;
    }
    const p = getInnerPoint(e.clientX, e.clientY);

    // Shift/Ctrl+mousedown toggles multi-select membership instead of starting a drag.
    if (e.shiftKey || e.metaKey || e.ctrlKey) {
      const newIds = selectedIds.includes(node.id) ? selectedIds.filter((id) => id !== node.id) : selectedIds.concat([node.id]);
      setSelectedIds(newIds);
      setSelectedId(node.id);
      setSelectedEdgeId(null);
      // A single remaining selection still gets the pop-up; two or more get
      // the non-blocking floating selection bar instead (rendered below).
      setPopupOpen(newIds.length === 1);
      return;
    }

    // Figure out which nodes should move together with this one:
    // - if it belongs to a saved group, every node in that group;
    // - else if it's part of the current multi-selection, the whole selection;
    // - otherwise, just itself.
    let moveIds;
    if (node.groupId) {
      moveIds = nodes.filter((n) => n.groupId === node.groupId).map((n) => n.id);
    } else if (selectedIds.includes(node.id) && selectedIds.length > 1) {
      moveIds = selectedIds;
    } else {
      moveIds = [node.id];
    }
    setSelectedIds(moveIds.length > 1 ? moveIds : []);

    const offsets = {};
    nodes.forEach((n) => { if (moveIds.includes(n.id)) offsets[n.id] = { offX: p.x - n.x, offY: p.y - n.y }; });
    dragRef.current = { ids: moveIds, offsets, startClientX: e.clientX, startClientY: e.clientY };
    setSelectedId(node.id);
    setSelectedEdgeId(null);
    // Un-pin any connectors touching a moving tile so they auto-redraw and stay attached.
    setEdges((eds) => eds.map((ed) => (moveIds.includes(ed.from) || moveIds.includes(ed.to) ? { ...ed, waypoints: null } : ed)));
  };

  const openStoryModal = (node) => {
    setSelectedId(node.id);
    setSelectedIds([]);
    setSelectedEdgeId(null);
    setPopupOpen(false);
    setModalNodeId(node.id);
  };

  const onNodeClick = (e, node) => {
    e.stopPropagation();
    if (!editMode) return; // View mode: single click never opens a pop-up (selection highlight only, handled on mousedown).
    if (connectMode && editMode) {
      if (!connectSource) {
        setConnectSource(node.id);
      } else if (connectSource !== node.id) {
        setEdges((eds) => eds.concat([edge(connectSource, node.id, null, "")]));
        setConnectSource(null);
      }
      return;
    }
    if (dragMovedRef.current) return; // the tail end of a drag, not a genuine click

    const now = Date.now();
    if (lastClickRef.current.id === node.id && now - lastClickRef.current.time < DBLCLICK_MS) {
      // Second click on the same node within the window: treat it as a
      // double-click and skip opening the single-click pop-up entirely.
      if (clickTimerRef.current) { clearTimeout(clickTimerRef.current); clickTimerRef.current = null; }
      lastClickRef.current = { id: null, time: 0 };
      openStoryModal(node);
      return;
    }

    // First click: hold off opening the pop-up briefly in case a second
    // click follows (which would make this a double-click instead).
    lastClickRef.current = { id: node.id, time: now };
    if (clickTimerRef.current) clearTimeout(clickTimerRef.current);
    clickTimerRef.current = setTimeout(() => {
      clickTimerRef.current = null;
      setPopupOpen(true);
    }, DBLCLICK_MS);
  };

  const onNodeDouble = (e, node) => {
    e.stopPropagation();
    if (!editMode) return; // View mode: double click never opens the story modal.
    // Fallback for environments where a native dblclick does land cleanly on
    // the node (e.g. it fires before the pop-up timer above opens anything).
    if (clickTimerRef.current) { clearTimeout(clickTimerRef.current); clickTimerRef.current = null; }
    lastClickRef.current = { id: null, time: 0 };
    openStoryModal(node);
  };

  const onBackgroundMouseDown = (e) => {
    if (e.shiftKey) {
      const p = getInnerPoint(e.clientX, e.clientY);
      dragRef.current = { marquee: true, x1: p.x, y1: p.y };
      setMarquee({ x1: p.x, y1: p.y, x2: p.x, y2: p.y });
      return;
    }
    dragRef.current = { panning: true, startX: e.clientX, startY: e.clientY, startPan: pan };
    setSelectedId(null);
    setSelectedIds([]);
    setSelectedEdgeId(null);
    setPopupOpen(false);
  };

  useEffect(() => {
    const onMove = (e) => {
      const d = dragRef.current;
      if (!d) return;
      if (d.panning) {
        setPan({ x: d.startPan.x + (e.clientX - d.startX), y: d.startPan.y + (e.clientY - d.startY) });
      } else if (d.marquee) {
        const p = getInnerPoint(e.clientX, e.clientY);
        setMarquee({ x1: d.x1, y1: d.y1, x2: p.x, y2: p.y });
      } else if (d.connecting) {
        const p = getInnerPoint(e.clientX, e.clientY);
        const hover = nodes.find((n) => n.id !== d.fromId && p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h);
        const hoverSide = hover ? nearestSide(hover, p) : null;
        setConnectDrag((cd) => (cd ? { ...cd, x: p.x, y: p.y, hoverTargetId: hover ? hover.id : null, hoverSide } : cd));
      } else if (d.ids) {
        if (!dragMovedRef.current && (Math.abs(e.clientX - d.startClientX) > 4 || Math.abs(e.clientY - d.startClientY) > 4)) {
          dragMovedRef.current = true;
        }
        const p = getInnerPoint(e.clientX, e.clientY);
        setNodes((nds) => nds.map((n) => {
          const off = d.offsets[n.id];
          return off ? { ...n, x: Math.round(p.x - off.offX), y: Math.round(p.y - off.offY) } : n;
        }));
      }
    };
    const onUp = (e) => {
      const d = dragRef.current;
      if (d && d.connecting) {
        const p = getInnerPoint(e.clientX, e.clientY);
        const target = nodes.find((n) => n.id !== d.fromId && p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h);
        if (target) {
          // Both anchors are now explicit: the side the user dragged FROM
          // (d.fromSide) and the single nearest side to where they released
          // the mouse on the target (toSide). This is what makes e.g.
          // "top of A" -> "west of B" connect exactly there instead of
          // being recomputed from the shapes' relative positions.
          const toSide = nearestSide(target, p);
          setEdges((eds) => eds.concat([edge(d.fromId, target.id, null, "", d.fromSide, toSide)]));
          setSelectedEdgeId(null);
          setSelectedId(null);
          setPopupOpen(false);
        }
        setConnectDrag(null);
      }
      if (d && d.marquee) {
        setMarquee((m) => {
          if (m) {
            const minX = Math.min(m.x1, m.x2), maxX = Math.max(m.x1, m.x2);
            const minY = Math.min(m.y1, m.y2), maxY = Math.max(m.y1, m.y2);
            const hit = nodes.filter((n) => n.x < maxX && n.x + n.w > minX && n.y < maxY && n.y + n.h > minY).map((n) => n.id);
            setSelectedIds(hit);
            setSelectedId(hit.length ? hit[hit.length - 1] : null);
            setSelectedEdgeId(null);
            // One node marqueed still gets the pop-up; multiple get the
            // non-blocking floating selection bar instead.
            setPopupOpen(hit.length === 1);
          }
          return null;
        });
      }
      dragRef.current = null;
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, [getInnerPoint, nodes]);

  const commitEdit = () => {
    if (editingId) {
      setNodes((nds) => nds.map((n) => (n.id === editingId ? { ...n, text: draftText } : n)));
    }
    setEditingId(null);
  };

  const addShape = (type) => {
    if (!editMode) return;
    const rect = viewportRef.current.getBoundingClientRect();
    // Must match getInnerPoint's conversion (screen -> node space), including
    // the TOP_PAD subtraction — otherwise the new node lands ~60000 units
    // below the visible canvas and just appears to vanish.
    const cx = (rect.width / 2 - pan.x) / zoom;
    const cy = (rect.height / 2 - pan.y) / zoom - TOP_PAD;
    const dims =
      type === "decision" ? { w: 170, h: 110 } :
      type === "terminal" ? { w: 170, h: 54 } :
      type === "note" ? { w: 190, h: 60 } :
      type === "io" ? { w: 190, h: 70 } :
      type === "document" ? { w: 190, h: 74 } :
      type === "predefined" ? { w: 190, h: 70 } :
      type === "database" ? { w: 150, h: 90 } :
      type === "connector" ? { w: 60, h: 60 } :
      { w: 180, h: 64 };
    const n = defaultNode({ type, x: Math.round(cx - dims.w / 2), y: Math.round(cy - dims.h / 2), w: dims.w, h: dims.h, text: "New step" });
    setNodes((nds) => nds.concat([n]));
    setSelectedId(n.id);
    setEditingId(n.id);
    setDraftText(n.text);
  };

  const deleteSelected = () => {
    if (!editMode) return;
    const ids = selectedIds.length ? selectedIds : (selectedId ? [selectedId] : []);
    if (ids.length) {
      setNodes((nds) => nds.filter((n) => !ids.includes(n.id)));
      setEdges((eds) => eds.filter((ed) => !ids.includes(ed.from) && !ids.includes(ed.to)));
      setSelectedId(null);
      setSelectedIds([]);
    }
    if (selectedEdgeId) {
      setEdges((eds) => eds.filter((ed) => ed.id !== selectedEdgeId));
      setSelectedEdgeId(null);
    }
    setPopupOpen(false);
  };

  const duplicateSelected = () => {
    if (!editMode) return;
    const ids = selectedIds.length ? selectedIds : (selectedId ? [selectedId] : []);
    if (!ids.length) return;
    const idMap = {};
    ids.forEach((id) => { idMap[id] = uid("n"); });
    // Preserve each original's own grouping instead of merging every duplicated
    // node into one new group: nodes that shared a group keep sharing a (new)
    // group id together, and nodes that weren't grouped stay ungrouped.
    const groupIdMap = {};
    const copies = nodes.filter((n) => ids.includes(n.id)).map((orig) => {
      let newGroupId = null;
      if (orig.groupId) {
        if (!groupIdMap[orig.groupId]) groupIdMap[orig.groupId] = uid("grp");
        newGroupId = groupIdMap[orig.groupId];
      }
      return {
        ...orig,
        id: idMap[orig.id],
        x: orig.x + 32,
        y: orig.y + 32,
        groupId: newGroupId,
        comments: (orig.comments || []).slice(),
        raci: { ...(orig.raci || {}) },
      };
    });
    // Recreate internal edges (both endpoints inside the duplicated set) so the copy stays wired together.
    const internalEdgeCopies = edges
      .filter((ed) => idMap[ed.from] && idMap[ed.to])
      .map((ed) => edge(idMap[ed.from], idMap[ed.to], null, ed.label || ""));
    setNodes((nds) => nds.concat(copies));
    setEdges((eds) => eds.concat(internalEdgeCopies));
    setSelectedIds(copies.length > 1 ? copies.map((c) => c.id) : []);
    setSelectedId(copies[copies.length - 1]?.id || null);
    setSelectedEdgeId(null);
  };

  const groupSelected = () => {
    if (!editMode || selectedIds.length < 2) return;
    const gid = uid("grp");
    setNodes((nds) => nds.map((n) => (selectedIds.includes(n.id) ? { ...n, groupId: gid } : n)));
  };

  const ungroupSelected = () => {
    if (!editMode) return;
    const ids = selectedIds.length ? selectedIds : (selectedId ? [selectedId] : []);
    if (!ids.length) return;
    const groupIds = new Set(nodes.filter((n) => ids.includes(n.id) && n.groupId).map((n) => n.groupId));
    setNodes((nds) => nds.map((n) => (groupIds.has(n.groupId) ? { ...n, groupId: null } : n)));
  };

  const toggleRole = (r) => {
    setActiveRoles((arr) => (arr.includes(r) ? arr.filter((x) => x !== r) : arr.concat([r])));
  };

  const roleActive = activeRoles.length > 0;

  const isRoleMatch = (n) =>
    !roleActive || activeRoles.some((r) => (n.role || "").toLowerCase().includes(r.toLowerCase()));

  const isDimmed = (n) => {
    if (demoPlaying || demoIndex >= 0) {
      const p = demoSequence.indexOf(n.id);
      // Keep done / current / next steps visible; dim everything further out
      // so attention stays on the "accelerator" path as it plays through.
      return p === -1 || p > demoIndex + 1;
    }
    if (!roleActive) return false;
    return !isRoleMatch(n);
  };

  const isSpotlight = (n) => {
    if (demoPlaying || demoIndex >= 0) return false; // demo visuals are driven by demoNodeState instead
    if (!roleActive) return false;
    return isRoleMatch(n);
  };

  // ---- Demo "accelerator" path helpers ----
  // Node state: 'done' (already passed), 'current' (active step, pulsing),
  // 'next' (upcoming step, blipping), or null (not part of / not near the path).
  const demoNodeState = (n) => {
    if (!(demoPlaying || demoIndex >= 0)) return null;
    const p = demoSequence.indexOf(n.id);
    if (p === -1) return null;
    if (p < demoIndex) return "done";
    if (p === demoIndex) return "current";
    if (p === demoIndex + 1) return "next";
    return null;
  };

  // Edge state along the demo path: 'traveled' (fully walked, solid green),
  // or 'transit' (the edge currently being crossed — gets the animated
  // dashed line + traveling comet dot).
  const demoEdgeState = (ed) => {
    if (!(demoPlaying || demoIndex >= 0)) return null;
    const pf = demoSequence.indexOf(ed.from);
    const pt = demoSequence.indexOf(ed.to);
    if (pf === -1 || pt === -1 || pt !== pf + 1) return null;
    if (pf < demoIndex) return "traveled";
    if (pf === demoIndex) return "transit";
    return null;
  };

  // ---------------- Config Type flow filter ----------------
  // Clicking a "Config Type" tab isolates that branch of the flowchart (the
  // Partial Details capture steps, the New Requirement/CR steps, or the
  // direct All-Details-Known path) by hiding every step that belongs to one
  // of the OTHER two branches. Steps that aren't tagged with a configFlow at
  // all (the shared decision gateway, the epic, backlog, sprint, and the
  // execution tracks) are common to every branch and always stay visible.
  // Clicking the active tab again clears the filter and shows everything.
  const toggleConfigFlow = (flow) => {
    setConfigFlow((cur) => (cur === flow ? null : flow));
  };
  const nodeInConfigFlow = (n) => !configFlow || !n.configFlow || n.configFlow === configFlow;
  const edgeInConfigFlow = (ed) => !configFlow || !ed.configFlow || ed.configFlow === configFlow;

  const visibleNodes = useMemo(
    () => (configFlow ? nodes.filter(nodeInConfigFlow) : nodes),
    [nodes, configFlow]
  );
  const visibleNodeIds = useMemo(() => new Set(visibleNodes.map((n) => n.id)), [visibleNodes]);
  const visibleEdges = useMemo(
    () => (configFlow
      ? edges.filter((ed) => edgeInConfigFlow(ed) && visibleNodeIds.has(ed.from) && visibleNodeIds.has(ed.to))
      : edges),
    [edges, configFlow, visibleNodeIds]
  );

  // ---------------- Demo Mode ----------------
  const startDemo = () => {
    setSelectedId(null); setSelectedEdgeId(null); setConnectMode(false);
    setDemoIndex(0); setDemoPlaying(true);
  };
  const stopDemo = () => { setDemoPlaying(false); setDemoIndex(-1); resetView(); };

  // ---------------- View > sub-tab: switch between the Main Flow and the
  // Detailed flowchart ----------------
  // Stashes whichever flow is being left (so edits made to it stick around),
  // loads the other flow's saved nodes/edges into the live canvas state, and
  // clears selection/demo/filter state that shouldn't carry across flows.
  // restoringRef is set first so the undo-history watcher treats this swap as
  // a restore rather than a new editable action.
  const switchFlow = (mode) => {
    if (mode === flowMode) return;
    flowDataRef.current[flowMode] = { nodes, edges };
    const target = flowDataRef.current[mode] || { nodes: [], edges: [] };
    restoringRef.current = true;
    lastSnapshotRef.current = { nodes: target.nodes, edges: target.edges };
    undoStackRef.current = [];
    redoStackRef.current = [];
    setCanUndo(false);
    setCanRedo(false);
    setFlowMode(mode);
    setNodes(target.nodes);
    setEdges(target.edges);
    setSelectedId(null);
    setSelectedIds([]);
    setSelectedEdgeId(null);
    setPopupOpen(false);
    setEditingId(null);
    setConnectMode(false);
    setConnectSource(null);
    setConfigFlow(null);
    setActiveRoles([]);
    setDemoPlaying(false);
    setDemoIndex(-1);
  };

  // Re-fit the viewport to whichever flowchart just became active — the two
  // datasets occupy very different coordinate ranges.
  useEffect(() => {
    resetView();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [flowMode]);

  useEffect(() => {
    if (!demoPlaying) return;
    const t = setTimeout(() => {
      setDemoIndex((i) => {
        if (i >= demoSequence.length - 1) { setDemoPlaying(false); return i; }
        return i + 1;
      });
    }, 1700);
    return () => clearTimeout(t);
  }, [demoPlaying, demoIndex]);

  useEffect(() => {
    if (demoIndex < 0 || !viewportRef.current) return;
    const n = nodes.find((nd) => nd.id === demoSequence[demoIndex]);
    if (!n) return;
    const rect = viewportRef.current.getBoundingClientRect();
    const targetZoom = 0.85;
    const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    setZoom(targetZoom);
    setPan({ x: rect.width / 2 - cx * targetZoom, y: rect.height / 2 - (cy + TOP_PAD) * targetZoom });
  }, [demoIndex]);

  const addComment = () => {
    if (!commentDraft.trim() || !modalNodeId) return;
    setNodes((nds) => nds.map((n) => (n.id === modalNodeId
      ? { ...n, comments: (n.comments || []).concat([{ author: "You", text: commentDraft.trim(), time: "Just now" }]) }
      : n)));
    setCommentDraft("");
  };

  useEffect(() => {
    const onKey = (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === "z" && !e.shiftKey) {
        e.preventDefault();
        undo();
        return;
      }
      if (mod && ((e.key.toLowerCase() === "z" && e.shiftKey) || e.key.toLowerCase() === "y")) {
        e.preventDefault();
        redo();
        return;
      }
      if ((e.key === "Delete" || e.key === "Backspace") && !editingId && !modalNodeId && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "INPUT") {
        deleteSelected();
      }
      if (e.key === "Escape") {
        setConnectMode(false);
        setConnectSource(null);
        setEditingId(null);
        setModalNodeId(null);
        setPopupOpen(false);
        if (connectDrag) { dragRef.current = null; setConnectDrag(null); }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify({ nodes, edges }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = flowMode === "detailed" ? "detailed-flowchart.json" : "epic-config-flow.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const importJSON = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data.nodes) && Array.isArray(data.edges)) {
          setNodes(data.nodes);
          setEdges(data.edges);
          setSelectedId(null);
          setSelectedEdgeId(null);
        } else {
          alert("This file doesn't look like a flowchart export.");
        }
      } catch (err) {
        alert("Couldn't read that file: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const exportPNG = () => {
    setEditingId(null);
    setSelectedId(null);
    setSelectedEdgeId(null);
    setTimeout(() => {
      if (!nodes.length) { alert("Nothing to export yet — add a shape first."); return; }

      // Export only the actual content's bounding box (plus a margin), not the whole
      // virtual canvas — the full canvas is far larger than browsers allow a <canvas>
      // to be, which was producing corrupt/undecodable PNG files.
      const pad = 60;
      const minX = Math.min(...nodes.map((n) => n.x)) - pad;
      const minY = Math.min(...nodes.map((n) => n.y)) - pad;
      const maxX = Math.max(...nodes.map((n) => n.x + n.w)) + pad;
      const maxY = Math.max(...nodes.map((n) => n.y + n.h)) + pad;
      const boxW = maxX - minX;
      const boxH = maxY - minY;

      const svgEl = document.getElementById("flow-svg");
      const clone = svgEl.cloneNode(true);
      // The cloned SVG is serialized and rasterized on its own, outside the
      // page's <style> sheet, so CSS-only rules (like anchor dots being
      // opacity:0 until hovered) don't carry over — every connector anchor
      // would otherwise show up as a solid blue dot in the exported PNG.
      // Anchors are just an editing aid, so strip them out of the export.
      clone.querySelectorAll(".anchor-dot, .anchor-hit").forEach((el) => el.remove());
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("viewBox", `${minX} ${minY} ${boxW} ${boxH}`);
      clone.setAttribute("width", boxW);
      clone.setAttribute("height", boxH);
      clone.style.background = "#FFFFFF";
      const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bg.setAttribute("x", minX); bg.setAttribute("y", minY);
      bg.setAttribute("width", boxW); bg.setAttribute("height", boxH);
      bg.setAttribute("fill", "#FFFFFF");
      clone.insertBefore(bg, clone.firstChild);

      const xml = new XMLSerializer().serializeToString(clone);
      const svg64 = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onerror = () => alert("Couldn't render the PNG preview. Please try again.");
      img.onload = () => {
        // Cap the raster size so we stay well within browser <canvas> pixel limits.
        const MAX_DIM = 4000;
        const outScale = Math.min(2, MAX_DIM / Math.max(boxW, boxH));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(boxW * outScale));
        canvas.height = Math.max(1, Math.round(boxH * outScale));
        const ctx = canvas.getContext("2d");
        ctx.scale(outScale, outScale);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, boxW, boxH);
        ctx.drawImage(img, 0, 0, boxW, boxH);
        canvas.toBlob((blob) => {
          if (!blob) { alert("Couldn't generate the PNG — please try again."); return; }
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.download = "epic-config-flow.png";
          a.href = url;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
      };
      img.src = svg64;
    }, 50);
  };

  // Changes zoom while keeping whatever is currently centered in the viewport
  // centered after the change. Needed because pan/zoom interact multiplicatively
  // with the padded canvas (TOP_PAD) — changing zoom without correcting pan
  // throws the content far off-screen.
  const zoomAt = (newZoomRaw) => {
    const newZoom = Math.max(0.3, Math.min(2, +newZoomRaw.toFixed(2)));
    if (!viewportRef.current) { setZoom(newZoom); return; }
    const rect = viewportRef.current.getBoundingClientRect();
    const cxScreen = rect.width / 2, cyScreen = rect.height / 2;
    const bx = (cxScreen - pan.x) / zoom;
    const by = (cyScreen - pan.y) / zoom;
    setZoom(newZoom);
    setPan({ x: cxScreen - bx * newZoom, y: cyScreen - by * newZoom });
  };

  // Frames the given nodes so the whole diagram fits the viewport at once —
  // used on load and by "Reset view", so a compact training diagram never
  // requires manual zooming/panning to see in full.
  const fitToContent = (list) => {
    if (!viewportRef.current || !list.length) return;
    const rect = viewportRef.current.getBoundingClientRect();
    const minX = Math.min(...list.map((n) => n.x));
    const minY = Math.min(...list.map((n) => n.y));
    const maxX = Math.max(...list.map((n) => n.x + n.w));
    const maxY = Math.max(...list.map((n) => n.y + n.h));
    const PAD = 60;
    const scaleX = (rect.width - PAD * 2) / Math.max(1, maxX - minX);
    const scaleY = (rect.height - PAD * 2) / Math.max(1, maxY - minY);
    const newZoom = Math.max(0.3, Math.min(scaleX, scaleY, 1.1));
    setZoom(newZoom);
    setPan({
      x: rect.width / 2 - (minX + (maxX - minX) / 2) * newZoom,
      y: rect.height / 2 - (minY + (maxY - minY) / 2 + TOP_PAD) * newZoom,
    });
  };

  const resetView = () => fitToContent((configFlow ? nodes.filter(nodeInConfigFlow) : nodes));

  // Fit the whole diagram into view the moment the canvas is ready, so first
  // load already shows everything without the user needing to zoom out.
  useEffect(() => {
    const t = setTimeout(() => fitToContent(nodes), 50);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const modalNode = nodes.find((n) => n.id === modalNodeId);
  const selEdge = edges.find((e2) => e2.id === selectedEdgeId);
  const selNode = nodes.find((n) => n.id === selectedId);

  const stageNodes = nodes.filter((n) => n.type === "process");
  const kpi = { "Not started": 0, "In Progress": 0, "Blocked": 0, "In Review": 0, "Done": 0 };
  stageNodes.forEach((n) => { kpi[n.status] = (kpi[n.status] || 0) + 1; });
  const kpiTotal = stageNodes.length || 1;
  const completionPct = Math.round(((kpi["Done"] || 0) / kpiTotal) * 100);

  // One pass that computes every connector's route and then nudges apart any
  // segments that would otherwise overlap, so lines stay visually distinct
  // no matter how the shapes are arranged.
  const edgeRoutes = useMemo(() => {
    const routes = visibleEdges.map((ed) => {
      const from = nodes.find((n) => n.id === ed.from);
      const to = nodes.find((n) => n.id === ed.to);
      if (!from || !to) return null;
      const raw = ed.waypoints && ed.waypoints.length
        ? ed.waypoints
        : (ed.fromSide && ed.toSide ? routeSides(from, ed.fromSide, to, ed.toSide) : autoRoute(from, to));
      return { ed, from, to, pts: raw.map((p) => [p[0], p[1]]) };
    });
    return deconflictRoutes(routes.filter(Boolean));
  }, [visibleEdges, nodes]);

  const activeMetricsNavItem = METRICS_NAV.find((m) => m.id === metricsSubTab) || METRICS_NAV[0];

  return (
    <div className="app-root">
      <header className="topbar">
        <div className="brand-row">
          <div className="brand-mark">JF</div>
          <div>
            <div className="brand-title">Jira Flow</div>
            <div className="brand-sub">
              {editMode
                ? "Edit mode · drag, connect, or delete shapes · hover a shape for connect anchors"
                : "View mode · click a shape to inspect it · switch to Edit to change the diagram"}
            </div>
          </div>
          <button
            className="flow-badge"
            onClick={() => setRibbonTab("view")}
            title="Switch between the Main Flow and the Detailed flowchart (View tab)"
          >
            {flowMode === "detailed" ? "🔎 Detailed flowchart" : "🗂 Main Flow"}
          </button>
          <div className="brand-status">
            <span className="dot-live" />
            {demoIndex >= 0 ? `Demo · ${FLOW_TYPE_LABEL[demoFlowType]} · step ${demoIndex + 1}/${demoSequence.length}` : `${completionPct}% complete`}
          </div>
        </div>

        <div className="ribbon-tabs" role="tablist" aria-label="Ribbon">
          {RIBBON_TABS.filter((t) => !t.editOnly || editMode).map((t) => (
            <button
              key={t.id}
              role="tab"
              aria-selected={ribbonTab === t.id}
              className={`ribbon-tab ${t.id === "demo" ? "demo-tab" : ""} ${ribbonTab === t.id ? "active" : ""}`}
              onClick={() => setRibbonTab(t.id)}
            >
              {t.icon} {t.label}
            </button>
          ))}
        </div>

        <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importJSON} />

        <div className="ribbon-panel">
          {ribbonTab === "home" && (
            <div className="toolbar-row">
              <div className="tool-group">
                <button
                  className={`mode-toggle ${editMode ? "edit" : "view"}`}
                  onClick={() => {
                    const enteringEdit = !editMode;
                    setEditMode(enteringEdit);
                    // Turning edit mode ON: jump straight to the Insert tab so the
                    // shape buttons are visible immediately, instead of leaving the
                    // user on Home/Flowchart where the shapes appear to be missing.
                    if (enteringEdit) setRibbonTab("insert");
                    setConnectMode(false);
                    setConnectSource(null);
                  }}

            ) : metricsSubTab === "flowEfficiency" ? (

                <div className="metrics-content-header">

                {jiraIssues.length && flowEfficiencyStats.rows.length ? (

                    <div className="metrics-note">Approximated from Start/Due/Created/Resolved dates already on each issue — a full changelog-based "time in status" breakdown would need the Jira issue changelog API.</div>
                    <div className="kpi-row">
                      <div className="kpi-card"><div className="kpi-label">Avg Flow Efficiency</div><div className={`kpi-value ${flowEfficiencyStats.overall >= 40 ? "good" : flowEfficiencyStats.overall >= 20 ? "warn" : ""}`}>{flowEfficiencyStats.overall}%</div></div>

              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

                </marker>
              </defs>
              {edgeRoutes.map((route) => {
                const { ed, pts } = route;
                const d = pathFromPoints(pts);
                const mid = midOfPoints(pts);
                const isSel = selectedEdgeId === ed.id;
                const demoEdge = demoEdgeState(ed);
                const strokeColor = demoEdge === "traveled" ? "#1E9E5A" : demoEdge === "transit" ? "#E0862F" : (isSel ? "#1868DB" : "#8791A0");
                const strokeWidth = demoEdge ? 3.2 : (isSel ? 2.6 : 1.8);
                return (
                  <g key={ed.id}>
                    <path d={d} fill="none" stroke="transparent" strokeWidth="14"
                      onClick={(e) => { e.stopPropagation(); setSelectedEdgeId(ed.id); setSelectedId(null); setSelectedIds([]); setPopupOpen(true); }}
                      style={{ cursor: "pointer" }} />
                    <path
                      d={d} fill="none" stroke={strokeColor} strokeWidth={strokeWidth}
                      strokeDasharray={demoEdge === "transit" ? "9,7" : undefined}

                      markerEnd="url(#arrow)" style={{ pointerEvents: "none" }}
                    />
                    {demoEdge === "transit" && (
                      <>
                        {/* soft trailing glow + bright comet head, timed to arrive just
                            before the 1.7s step advances (GPS-route-replay feel); a fresh
                            edge mounts these fresh each step, so the runner always starts
                            at the tail of the new path rather than jumping mid-flight */}
                        <circle r="11" fill="#E0862F" opacity="0.22" className="demo-runner-glow">
                          <animateMotion dur="1.6s" repeatCount="1" fill="freeze" path={d} />
                        </circle>
                        <circle r="6" fill="#FFB020" className="demo-runner-dot">
                          <animateMotion dur="1.6s" repeatCount="1" fill="freeze" path={d} />
                        </circle>
                      </>
                    )}

                      <g style={{ pointerEvents: "none" }}>
                        <rect x={mid[0] - ed.label.length * 3.6 - 4} y={mid[1] - 10} width={ed.label.length * 7.2 + 8} height="16" fill="#FFFFFF" opacity="0.92" rx="3" />
                        <text x={mid[0]} y={mid[1] - 1} textAnchor="middle" fontSize="11" fill="#4B5563" fontFamily="Arial, sans-serif" fontStyle="italic">{ed.label}</text>
                      </g>
                    )}
                  </g>
                );
              })}
              {(() => {
                const groupIds = [...new Set(visibleNodes.filter((n) => n.groupId).map((n) => n.groupId))];
                return groupIds.map((gid) => {
                  const members = visibleNodes.filter((n) => n.groupId === gid);
                  if (!members.length) return null;
                  const minX = Math.min(...members.map((n) => n.x)) - 14;
                  const minY = Math.min(...members.map((n) => n.y)) - 14;
                  const maxX = Math.max(...members.map((n) => n.x + n.w)) + 14;
                  const maxY = Math.max(...members.map((n) => n.y + n.h)) + 14;
                  return (
                    <rect
                      key={gid}
                      x={minX} y={minY} width={maxX - minX} height={maxY - minY}
                      rx={14} fill="rgba(24,104,219,0.035)" stroke="#8791A0" strokeWidth="1.5" strokeDasharray="8,5"
                      style={{ pointerEvents: "none" }}
                    />
                  );
                });
              })()}

                const fromNode = nodes.find((n) => n.id === connectDrag.fromId);
                if (!fromNode) return null;
                const [sx, sy] = anchorPoint(fromNode, connectDrag.fromSide);
                // Once hovering a valid target, preview the path snapped to the
                // exact candidate anchor rather than a straight line to the
                // cursor, so what you see is what you'll get on release.
                const target = connectDrag.hoverTargetId ? nodes.find((n) => n.id === connectDrag.hoverTargetId) : null;
                const d = target && connectDrag.hoverSide
                  ? pathFromPoints(routeSides(fromNode, connectDrag.fromSide, target, connectDrag.hoverSide))

                return (
                  <path
                    d={d}
                    fill="none" stroke="#1868DB" strokeWidth="2.2" strokeDasharray="7,5"
                    style={{ pointerEvents: "none" }}
                  />
                );
              })()}

                  fill="rgba(24,104,219,0.10)" stroke="#1868DB" strokeWidth="1.4" strokeDasharray="5,4"
                  style={{ pointerEvents: "none" }}
                />
              )}
            </svg>

            {editingId && nodes.find((n) => n.id === editingId) && (() => {

              return (
                <textarea

                  className="edit-overlay"
                  style={{ left: n.x, top: n.y, width: n.w, height: n.h }}
                  value={draftText}
                  onChange={(e) => setDraftText(e.target.value)}
                  onMouseDown={(e) => {
                    e.stopPropagation();
                    // The text box sits directly on top of the shape, so a
                    // plain click here should just place the text cursor —
                    // but if the mouse actually moves (drag intent), commit
                    // the edit and hand off to the normal node-drag flow.
                    // Without this, a freshly added node (which opens
                    // straight into edit mode) can't be repositioned until
                    // you click away once first.
                    const startX = e.clientX, startY = e.clientY;
                    let dragging = false;
                    const onMoveCheck = (ev) => {
                      if (!dragging && (Math.abs(ev.clientX - startX) > 4 || Math.abs(ev.clientY - startY) > 4)) {
                        dragging = true;
                        window.removeEventListener("mousemove", onMoveCheck);
                        window.removeEventListener("mouseup", onUpCheck);
                        commitEdit();
                        onNodeMouseDown(ev, n);
                      }
                    };
                    const onUpCheck = () => {
                      window.removeEventListener("mousemove", onMoveCheck);
                      window.removeEventListener("mouseup", onUpCheck);
                    };
                    window.addEventListener("mousemove", onMoveCheck);
                    window.addEventListener("mouseup", onUpCheck);
                  }}
                  onBlur={commitEdit}
                  onKeyDown={(e) => {
                    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitEdit(); }
                  }}
                />
              );
            })()}

                  </div>
                )}
                {(selNode.person || selNode.role || selNode.notes || selNode.acceptanceCriteria || selNode.dependencies || (selNode.comments && selNode.comments.length)) && (
                  <div className="panel-meta">
                    {selNode.person && <div><b>Owner:</b> {selNode.person}</div>}
                    {selNode.role && <div><b>Role:</b> {selNode.role}</div>}
                    {selNode.notes && <div><b>Notes:</b> {selNode.notes}</div>}
                    {selNode.acceptanceCriteria && <div><b>AC:</b> {selNode.acceptanceCriteria}</div>}
                    {selNode.dependencies && <div><b>Dependencies:</b> {selNode.dependencies}</div>}
                    {selNode.comments && selNode.comments.length > 0 && <div><b>Comments:</b> {selNode.comments.length}</div>}
                  </div>
                )}
              </div>
            ) : selEdge ? (
              <div>
                <div className="modal-title">Selected connector</div>
                {editMode ? (
                  <>
                    <label className="panel-label">Label</label>
                    <input
                      className="panel-input"
                      value={selEdge.label}
                      onChange={(e) => setEdges((eds) => eds.map((ed2) => (ed2.id === selEdge.id ? { ...ed2, label: e.target.value } : ed2)))}
                      placeholder="e.g. Yes / No"
                    />
                    <button className="panel-btn danger" onClick={deleteSelected}>🗑 Delete connector</button>
                  </>
                ) : (
                  <>
                    {selEdge.label && <div className="modal-step">Label: {selEdge.label}</div>}
                    <div className="modal-step">Switch to Edit Mode to relabel or delete this connector.</div>
                  </>
                )}
              </div>
            ) : null}

            <div className="modal-actions">
              <button className="panel-btn" onClick={() => setPopupOpen(false)}>Close</button>
            </div>
          </div>
        </div>
      )}

      {showJiraPanel && (
          <div className="modal-backdrop" onClick={() => setShowJiraPanel(false)}>
            <div className="modal modal-wide" onClick={(e) => e.stopPropagation()}>
              <div className="modal-title">Jira Dashboard</div>
              <div className="modal-step">Connect to Jira or import a JSON export. Burndown/burnup and team progress charts appear under Metrics → Gantt once issues are loaded.</div>

              {jiraError && <div className="jira-status-line err">{jiraError}</div>}
              {jiraInfo && !jiraError && <div className="jira-status-line ok">{jiraInfo}</div>}

              {jiraTab === "connect" && (
                <div>
                  <div className="jira-status-line ok">
                    🔒 CORS-safe via Cloudflare Worker proxy — this page is hardcoded to use{" "}
                    <code style={{ background: "rgba(0,0,0,0.06)", padding: "1px 4px", borderRadius: 3 }}>{JIRA_PROXY_URL}</code>.
                    The worker calls Jira's <code style={{ background: "rgba(0,0,0,0.06)", padding: "1px 4px", borderRadius: 3 }}>/rest/api/3/search/jql</code> server-to-server
                    and hands the JSON back, so the browser never talks to Jira directly. Your API token is only ever
                    sent to the worker, never stored by it.
                  </div>
                  <div className="jira-grid-3">
                    <div>
                      <label>Jira base URL</label>
                      <input
                        placeholder="https://yourcompany.atlassian.net"
                        value={jiraConfig.baseUrl}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, baseUrl: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>Account email</label>
                      <input
                        placeholder="you@company.com"
                        value={jiraConfig.email}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, email: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>API token</label>
                      <input
                        type="password"
                        placeholder="Jira API token"
                        value={jiraConfig.token}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, token: e.target.value }))}
                      />
                    </div>
                  </div>
                  <label>JQL query</label>
                  <input
                    placeholder='project = ABC AND sprint in openSprints() ORDER BY created ASC'
                    value={jiraConfig.jql}
                    onChange={(e) => setJiraConfig((c) => ({ ...c, jql: e.target.value }))}
                  />
                  <div className="jira-grid-3">
                    <div>
                      <label>Start date field id</label>
                      <input
                        placeholder="customfield_10015"
                        value={jiraConfig.startDateField}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, startDateField: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>Due date field id</label>
                      <input
                        placeholder="duedate"
                        value={jiraConfig.dueDateField}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, dueDateField: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>Original end date field id</label>
                      <input
                        placeholder="customfield_1XXXX"
                        value={jiraConfig.origEndDateField}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, origEndDateField: e.target.value }))}
                      />
                    </div>
                  </div>
                  <div className="jira-grid-3">
                    <div>
                      <label>Story points field id</label>
                      <input
                        placeholder="customfield_10016"
                        value={jiraConfig.pointsField}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, pointsField: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>Leading track field id</label>
                      <input
                        placeholder="customfield_1XXXX (optional)"
                        value={jiraConfig.leadingTrackField}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, leadingTrackField: e.target.value }))}
                      />
                    </div>
                    <div>
                      <label>Parent field id (classic Epic Link)</label>
                      <input
                        placeholder="customfield_10014 (optional)"
                        value={jiraConfig.parentField}
                        onChange={(e) => setJiraConfig((c) => ({ ...c, parentField: e.target.value }))}
                      />
                    </div>
                  </div>
                  <div className="jira-grid-3">
                    <div>
                      <label>&nbsp;</label>
                      <label style={{ display: "flex", alignItems: "center", gap: 6, fontWeight: 400, marginTop: 8 }}>
                        <input
                          type="checkbox"
                          style={{ width: "auto" }}
                          checked={jiraConfig.remember}
                          onChange={(e) => setJiraConfig((c) => ({ ...c, remember: e.target.checked }))}
                        />
                        Remember these settings in this browser (token stored in plain text locally)
                      </label>
                    </div>
                    <div>
                      <label>&nbsp;</label>
                      <button className="panel-btn" style={{ marginTop: 6 }} onClick={fetchJiraIssues} disabled={jiraLoading}>
                        {jiraLoading ? "Fetching…" : "⇩ Fetch from Jira"}
                      </button>
                    </div>
                  </div>

                  <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10 }}>
                    <button className="panel-btn" style={{ width: "auto" }} onClick={testJiraProxy}>🔍 Test proxy connection</button>
                    {jiraProxyStatus && <span style={{ fontSize: 12.5 }}>{jiraProxyStatus}</span>}
                  </div>

                  <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--border)" }}>
                    <label>Or import a JSON export (always works, no proxy needed)</label>
                    <button className="panel-btn" style={{ width: "auto" }} onClick={() => jiraFileInputRef.current.click()}>⬆ Import JSON export</button>
                    <input ref={jiraFileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importJiraJSON} />
                  </div>

                  <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px solid var(--border)" }}>
                    <label>Connection settings file (skip retyping the fields above next time)</label>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                      <button className="panel-btn" style={{ width: "auto" }} onClick={downloadJiraConfig}>⬇ Download config as JSON</button>
                      <button className="panel-btn" style={{ width: "auto" }} onClick={() => jiraConfigFileInputRef.current.click()}>⬆ Load config from JSON</button>
                      <input ref={jiraConfigFileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importJiraConfig} />
                    </div>
                    <div className="jira-status-line info" style={{ marginTop: 8 }}>
                      The downloaded file includes your API token in plain text — store it somewhere private and avoid sharing it.
                    </div>
                  </div>
                </div>
              )}

              <div className="modal-actions">
                <button className="panel-btn" onClick={() => setShowJiraPanel(false)}>Close</button>
              </div>
            </div>
          </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
