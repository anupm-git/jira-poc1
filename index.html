<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jira Flow</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --border: #E2E5EA;
    --bg: #F5F6F8;
    --card: #FFFFFF;
    --text: #1F2530;
    --muted: #6B7280;
    --accent: #2F5FA8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
  #root { height: 100%; }
  .app-root { display: flex; flex-direction: column; height: 100%; }

  /* ---- Fluid sizing tokens: scale continuously with viewport width so a 14"
     laptop (~1366-1536px) and a 24"+ monitor (~1920-2560px) each get a toolbar
     sized for them, instead of jumping between fixed breakpoints. ---- */
  :root {
    --tb-font: clamp(10.5px, 0.62vw + 6px, 12.5px);
    --tb-pad-y: clamp(3px, 0.16vw + 1px, 6px);
    --tb-pad-x: clamp(6px, 0.35vw + 2px, 10px);
    --tb-gap: clamp(3px, 0.25vw, 6px);
    --tb-group-gap: clamp(4px, 0.4vw, 10px);
    --tb-icon: clamp(11px, 0.7vw + 6px, 14px);
  }

  .topbar {
    display: flex; flex-direction: column; align-items: stretch;
    gap: 6px; padding: clamp(6px, 0.6vw, 12px) clamp(10px, 1.2vw, 20px);
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .brand-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand-title { font-size: clamp(14px, 0.9vw + 8px, 18px); font-weight: 700; color: var(--text); white-space: nowrap; }
  .brand-sub { font-size: 11px; color: var(--muted); }

  .toolbar { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: var(--tb-gap) var(--tb-group-gap); }
  .toolbar-row { display: contents; }
  .tool-group {
    display: flex; align-items: center; gap: 3px; background: #F8F9FB; border: 1px solid var(--border);
    border-radius: 7px; padding: 2px var(--tb-pad-x); flex-wrap: nowrap; white-space: nowrap;
  }
  .tool-label { font-size: 10px; color: var(--muted); padding: 0 3px; white-space: nowrap; }
  button {
    font-family: inherit; font-size: var(--tb-font); line-height: 1.2; color: var(--text); background: #FFFFFF;
    border: 1px solid var(--border); border-radius: 6px; padding: var(--tb-pad-y) var(--tb-pad-x); cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #EEF2F8; border-color: #C7D2E0; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .zoom-readout { font-size: var(--tb-font); color: var(--muted); min-width: 34px; text-align: center; }

  .mode-toggle { font-weight: 700; }
  .mode-toggle.view { background: #F0F1F3; border-color: #9AA1AC; color: #3C4451; }
  .mode-toggle.edit { background: #1E7A47; border-color: #1E7A47; color: #fff; }

  .help-strip {
    background: #FFF7E6; border-bottom: 1px solid #F0DDA6; color: #7A5A0A;
    font-size: 12.5px; padding: 7px 20px; display: flex; align-items: center; justify-content: space-between;
  }
  .help-strip .dismiss { background: transparent; border: none; color: #7A5A0A; font-size: 13px; cursor: pointer; padding: 2px 6px; }

  .stage { flex: 1; display: flex; min-height: 0; }
  .viewport {
    flex: 1; position: relative; overflow: hidden; background:
      linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px) 0 0 / 24px 24px, var(--bg);
    cursor: grab;
  }
  .viewport:active { cursor: grabbing; }
  .inner { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  .edit-overlay {
    position: absolute; z-index: 5; resize: none; font-family: Arial, sans-serif;
    font-size: 13px; font-weight: 600; text-align: center; padding: 4px; border-radius: 8px;
    border: 2px solid var(--accent); outline: none; background: #FFFFFF; color: var(--text);
  }

  .kpi-float {
    position: absolute; top: 14px; right: 14px; width: 220px; max-height: calc(100% - 28px);
    overflow-y: auto; z-index: 6; box-shadow: 0 4px 14px rgba(0,0,0,0.14);
  }
  .panel-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 14px; background: #FCFCFD; }
  .panel-card.muted { color: var(--muted); font-size: 13px; }
  .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 8px; }
  .panel-step-text { font-size: 14.5px; font-weight: 700; margin-bottom: 8px; }
  .panel-row { margin-bottom: 10px; }
  .status-chip { display: inline-block; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .panel-btn {
    display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 8px 10px;
    background: #fff; border: 1px solid var(--border); border-radius: 7px; font-size: 13px;
  }
  .panel-btn:hover { background: #EEF2F8; }
  .panel-btn.danger { color: #B23A3A; }
  .panel-btn.danger:hover { background: #FBEAEA; border-color: #E9B9B9; }
  .panel-meta { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12.5px; color: #3C4451; line-height: 1.6; }
  .panel-label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .panel-input {
    width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit;
  }

  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #3C4451; margin-bottom: 7px; }
  .swatch { width: 16px; height: 16px; border: 2px solid; border-radius: 4px; flex-shrink: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-left: 3px; margin-right: 3px; }

  /* N/S/E/W connection anchors: small dot only shows on hover, but the actual
     grabbable hit-zone (.anchor-hit) is a larger invisible circle so it's easy
     to grab precisely even at low zoom levels. */
  .node-group .anchor-dot { opacity: 0; transition: opacity 0.12s ease; }
  .node-group:hover .anchor-dot { opacity: 1; }
  .node-group .anchor-hit { fill: transparent; cursor: crosshair; }
  .node-group .anchor-hit:hover + .anchor-dot { opacity: 1; fill: #1868DB; r: 6.5; }
  /* While dragging a new connector, the single nearest anchor on the hovered
     target node is highlighted in green so it's unambiguous which N/S/E/W
     point will be used when the mouse is released. */
  .anchor-dot.candidate { opacity: 1 !important; fill: #1E9E5A !important; stroke: #0E4227 !important; r: 7.5 !important; }

  /* Color palette swatches (side panel) */
  .palette-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
  .palette-swatch {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid rgba(0,0,0,0.12); cursor: pointer;
    padding: 0; flex-shrink: 0;
  }
  .palette-swatch.selected { border-color: #1868DB; box-shadow: 0 0 0 2px rgba(24,104,219,0.25); }
  .palette-swatch.reset { background: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20, 24, 32, 0.45); display: flex;
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    width: 380px; max-width: 92vw; background: #fff; border-radius: 12px; padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25); max-height: 88vh; overflow-y: auto;
  }
  .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .modal-step { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .modal label { display: block; font-size: 12px; font-weight: 600; color: #3C4451; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 8px 9px; border: 1px solid var(--border); border-radius: 7px;
    font-family: inherit; font-size: 13px; resize: vertical;
  }
  .modal-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
  .modal-actions .panel-btn { width: auto; padding: 8px 18px; background: var(--accent); color: #fff; border-color: var(--accent); }

  .modal-wide { width: 920px; max-width: 96vw; }
  .jira-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 10px; }
  .jira-tabs { display: flex; gap: 6px; margin: 4px 0 14px; }
  .jira-tabs button { font-size: 12px; padding: 6px 12px; }
  .jira-status-line { font-size: 12px; padding: 8px 10px; border-radius: 7px; margin: 10px 0; }
  .jira-status-line.err { background: #FBEAEA; color: #7A2020; border: 1px solid #E3B3B3; }
  .jira-status-line.ok { background: #E7F7EE; color: #0E4227; border: 1px solid #A9DBC0; }
  .jira-status-line.info { background: #EAF1FB; color: #173561; border: 1px solid #C7D2E0; }
  .jira-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .jira-table th, .jira-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .jira-table th { color: var(--muted); font-weight: 600; }
  .jira-chart-box { background: #F8F9FB; border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 14px; }

  .chip-btn { font-size: 10.5px; padding: 5px 8px; }
  .mini-chip {
    display: inline-block; background: #EAF1FB; color: #173561; border: 1px solid #C7D2E0;
    border-radius: 999px; font-size: 11px; font-weight: 600; padding: 2px 9px; margin: 0 5px 5px 0;
  }

  .kpi-bar-track { width: 100%; height: 6px; background: #EDEFF3; border-radius: 999px; overflow: hidden; }
  .kpi-bar-fill { height: 100%; border-radius: 999px; transition: width 0.2s; }

  .minimap {
    position: absolute; bottom: 14px; right: 14px; background: #fff; border: 1px solid var(--border);
    border-radius: 8px; padding: 4px; box-shadow: 0 4px 14px rgba(0,0,0,0.14); cursor: pointer; z-index: 6;
  }

  .modal-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .modal-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 8px; margin-top: 4px; }
  .raci-label { display: block; font-size: 10.5px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
  .raci-input { width: 100%; padding: 6px 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }

  .comment-list { max-height: 140px; overflow-y: auto; margin-top: 4px; }
  .comment-item { border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; margin-bottom: 6px; font-size: 12.5px; background: #FAFBFC; }
  .comment-meta { font-size: 11px; color: var(--muted); margin-bottom: 2px; }

  @keyframes demoPulse { 0% { stroke-opacity: 1; } 50% { stroke-opacity: 0.25; } 100% { stroke-opacity: 1; } }
  .demo-pulse { animation: demoPulse 1.1s ease-in-out infinite; }


</style>

  // fromSide/toSide: when set (an explicit anchor-to-anchor drag), the
  // connector always renders from that exact pair of N/S/E/W points. When
  // left null, the connector auto-picks whichever sides face each other as
  // the shapes move (legacy click-to-connect behavior).
  return { id: uid("e"), from, to, waypoints, label: label || "", fromSide: fromSide || null, toSide: toSide || null };
}

// ---------------- helpers ----------------
function wrapLines(text, w, fontSize) {
  const maxChars = Math.max(6, Math.floor((w - 20) / (fontSize * 0.6)));
  const words = String(text || "").split(/\s+/);
  const lines = [];
  let cur = "";
  words.forEach((word) => {
    const test = cur ? cur + " " + word : word;
    if (test.length > maxChars && cur) {
      lines.push(cur);
      cur = word;
    } else {
      cur = test;
    }
  });
  if (cur) lines.push(cur);
  return lines.slice(0, 5);
}

function pathFromPoints(pts) {
  return pts.map((p, i) => `${i === 0 ? "M" : "L"}${p[0]},${p[1]}`).join(" ");
}

function midOfPoints(pts) {
  const seg = Math.floor(pts.length / 2);
  const a = pts[Math.max(0, seg - 1)];
  const b = pts[seg] || a;
  return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
}

// ---------------- auto-routing (keeps connectors attached when tiles move) ----------------
function anchorPoint(n, side) {
  const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
  if (side === "right") return [n.x + n.w, cy];
  if (side === "left") return [n.x, cy];
  if (side === "top") return [cx, n.y];
  return [cx, n.y + n.h];
}

function autoRoute(from, to) {
  const fcx = from.x + from.w / 2, fcy = from.y + from.h / 2;
  const tcx = to.x + to.w / 2, tcy = to.y + to.h / 2;
  const dx = tcx - fcx, dy = tcy - fcy;
  if (Math.abs(dx) > Math.abs(dy)) {
    const fromSide = dx >= 0 ? "right" : "left";
    const toSide = dx >= 0 ? "left" : "right";
    const p1 = anchorPoint(from, fromSide);
    const p2 = anchorPoint(to, toSide);
    const midX = (p1[0] + p2[0]) / 2;
    return [p1, [midX, p1[1]], [midX, p2[1]], p2];
  }
  const fromSide = dy >= 0 ? "bottom" : "top";
  const toSide = dy >= 0 ? "top" : "bottom";
  const p1 = anchorPoint(from, fromSide);
  const p2 = anchorPoint(to, toSide);
  const midY = (p1[1] + p2[1]) / 2;
  return [p1, [p1[0], midY], [p2[0], midY], p2];
}

// Which of a node's 4 anchors (N/S/E/W) is physically closest to a given
// point. Used so that releasing a connector drag over a node snaps to the
// exact anchor the cursor is nearest to, rather than guessing from the two
// shapes' relative positions (which is what caused connectors to visually
// land on the wrong side / overlap another connector).
function nearestSide(n, p) {
  const sides = ["top", "right", "bottom", "left"];
  let best = sides[0], bestD = Infinity;
  sides.forEach((s) => {
    const [ax, ay] = anchorPoint(n, s);
    const d = (ax - p.x) ** 2 + (ay - p.y) ** 2;
    if (d < bestD) { bestD = d; best = s; }
  });
  return best;
}

const SIDE_DIR = { top: [0, -1], bottom: [0, 1], left: [-1, 0], right: [1, 0] };

// Routes an orthogonal (Manhattan) path between two EXPLICIT, independently
// chosen anchors — e.g. the "top" of one shape to the "left" of another —
// instead of assuming the two anchors are always an opposing left/right or
// top/bottom pair like autoRoute() does. Each endpoint first steps straight
// out from its shape along the anchor's own direction (a short "stub") before
// the two stubs are joined, so the line never cuts back across the shape it
// started from and doesn't overlap the shape body near the anchor.
function routeSides(from, fromSide, to, toSide) {
  const p1 = anchorPoint(from, fromSide);
  const p2 = anchorPoint(to, toSide);
  const d1 = SIDE_DIR[fromSide], d2 = SIDE_DIR[toSide];
  const STUB = 26;
  const s1 = [p1[0] + d1[0] * STUB, p1[1] + d1[1] * STUB];
  const s2 = [p2[0] + d2[0] * STUB, p2[1] + d2[1] * STUB];

  const horizontal1 = d1[0] !== 0, horizontal2 = d2[0] !== 0;
  if (horizontal1 && horizontal2) {
    const midX = (s1[0] + s2[0]) / 2;
    return [p1, s1, [midX, s1[1]], [midX, s2[1]], s2, p2];
  }
  if (!horizontal1 && !horizontal2) {
    const midY = (s1[1] + s2[1]) / 2;
    return [p1, s1, [s1[0], midY], [s2[0], midY], s2, p2];
  }
  // One side is horizontal (left/right) and the other vertical (top/bottom):
  // join the stubs with a single elbow at the corner they share.
  if (horizontal1) return [p1, s1, [s2[0], s1[1]], s2, p2];
  return [p1, s1, [s1[0], s2[1]], s2, p2];
}

// Two numeric ranges (each [min,max]) overlap (or touch within a small
// tolerance) along a shared axis.
function rangesOverlap(a, b, pad) {
  return a[0] - pad <= b[1] && b[0] - pad <= a[1];
}

// Nudges apart connector segments that would otherwise sit exactly on top of
// each other. Operates on the already-computed point lists for every edge
// (regardless of whether they came from autoRoute, routeSides, or hand-authored
// waypoints), so it's a single pass that de-conflicts the whole diagram.
//
// Only INTERIOR segments are moved — i.e. every segment except the very first
// and very last of a path, which are the short "stubs" that touch the node
// anchors. Moving those would visually detach the line from the shape, so
// they're left alone; everything routed in the open space between shapes is
// fair game. For an interior segment, both of its endpoints are shifted by the
// same amount along the segment's own axis (y for a horizontal run, x for a
// vertical run) — that keeps the segment straight and only changes the
// length of the neighboring perpendicular segments, so the path stays a
// valid orthogonal (Manhattan) polyline and both ends stay anchored.
function deconflictRoutes(routes, gap) {
  const GAP = gap || 12;
  const TOL = 6;
  const segs = [];
  routes.forEach((r, ri) => {
    const pts = r.pts;
    for (let i = 0; i < pts.length - 1; i++) {
      if (i === 0 || i === pts.length - 2) continue; // skip stubs touching the node anchors
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      if (Math.abs(y1 - y2) < 0.5 && Math.abs(x1 - x2) >= 0.5) {
        segs.push({ ri, i, orientation: "h", coord: y1, range: [Math.min(x1, x2), Math.max(x1, x2)] });
      } else if (Math.abs(x1 - x2) < 0.5 && Math.abs(y1 - y2) >= 0.5) {
        segs.push({ ri, i, orientation: "v", coord: x1, range: [Math.min(y1, y2), Math.max(y1, y2)] });
      }
    }
  });

  const groups = [];
  segs.forEach((s) => {
    const g = groups.find((g2) => g2.orientation === s.orientation && Math.abs(g2.coord - s.coord) < TOL && rangesOverlap(g2.range, s.range, TOL));
    if (g) {
      g.items.push(s);
      g.range = [Math.min(g.range[0], s.range[0]), Math.max(g.range[1], s.range[1])];
    } else {
      groups.push({ orientation: s.orientation, coord: s.coord, range: [s.range[0], s.range[1]], items: [s] });
    }
  });

  groups.forEach((g) => {
    const n = g.items.length;
    if (n < 2) return;
    g.items.forEach((s, idx) => {
      const offset = (idx - (n - 1) / 2) * GAP;
      if (!offset) return;
      const pts = routes[s.ri].pts;
      if (s.orientation === "h") {
        pts[s.i][1] += offset;
        pts[s.i + 1][1] += offset;
      } else {
        pts[s.i][0] += offset;
        pts[s.i + 1][0] += offset;
      }
    });
  });

  return routes;
}

// ---------------- shape renderer ----------------
function ShapeBody({ node }) {
  const base = TYPE_STYLE[node.type] || TYPE_STYLE.process;
  const s = node.color || base; // per-node color override wins over the type default
  const { x, y, w, h } = node;
  if (node.type === "decision") {
    const pts = `${x + w / 2},${y} ${x + w},${y + h / 2} ${x + w / 2},${y + h} ${x},${y + h / 2}`;
    return <polygon points={pts} fill={s.fill} stroke={s.stroke} strokeWidth="2" />;
  }
  if (node.type === "terminal") {
    return <rect x={x} y={y} width={w} height={h} rx={h / 2} ry={h / 2} fill={s.fill} stroke={s.stroke} strokeWidth="2" />;
  }
  if (node.type === "note") {
    return <rect x={x} y={y} width={w} height={h} rx={6} ry={6} fill={s.fill} stroke={s.stroke} strokeWidth="1.5" strokeDasharray="5,4" />;
  }
  if (node.type === "highlight") {
    return <rect x={x} y={y} width={w} height={h} rx={10} ry={10} fill={s.fill} stroke={s.stroke} strokeWidth="2.5" />;
  }
  if (node.type === "io") {
    // Parallelogram — data / input-output
    const skew = Math.min(24, w * 0.18);
    const pts = `${x + skew},${y} ${x + w},${y} ${x + w - skew},${y + h} ${x},${y + h}`;
    return <polygon points={pts} fill={s.fill} stroke={s.stroke} strokeWidth="2" />;
  }
  if (node.type === "document") {
    // Rectangle with a wavy bottom edge
    const waveH = 10;
    const d = `M${x},${y} H${x + w} V${y + h - waveH}
      C${x + w * 0.75},${y + h + waveH} ${x + w * 0.25},${y + h - waveH * 2} ${x},${y + h}
      Z`;
    return <path d={d} fill={s.fill} stroke={s.stroke} strokeWidth="2" strokeLinejoin="round" />;
  }
  if (node.type === "predefined") {
    // Predefined process / subroutine — rectangle with inset vertical bars
    const inset = Math.min(14, w * 0.1);
    return (
      <g>
        <rect x={x} y={y} width={w} height={h} rx={4} ry={4} fill={s.fill} stroke={s.stroke} strokeWidth="2" />
        <line x1={x + inset} y1={y} x2={x + inset} y2={y + h} stroke={s.stroke} strokeWidth="2" />
        <line x1={x + w - inset} y1={y} x2={x + w - inset} y2={y + h} stroke={s.stroke} strokeWidth="2" />
      </g>
    );
  }
  if (node.type === "database") {
    // Cylinder — data store
    const ry = Math.min(14, h * 0.18);
    const d = `M${x},${y + ry}
      A${w / 2},${ry} 0 0 0 ${x + w},${y + ry}
      V${y + h - ry}
      A${w / 2},${ry} 0 0 1 ${x},${y + h - ry}
      Z`;
    return (
      <g>
        <path d={d} fill={s.fill} stroke={s.stroke} strokeWidth="2" />
        <ellipse cx={x + w / 2} cy={y + ry} rx={w / 2} ry={ry} fill={s.fill} stroke={s.stroke} strokeWidth="2" />
      </g>
    );
  }
  if (node.type === "connector") {
    // Small circle — on-page connector
    const r = Math.min(w, h) / 2;
    return <circle cx={x + w / 2} cy={y + h / 2} r={r} fill={s.fill} stroke={s.stroke} strokeWidth="2" />;
  }
  return <rect x={x} y={y} width={w} height={h} rx={8} ry={8} fill={s.fill} stroke={s.stroke} strokeWidth="2" />;
}

function NodeView({ node, selected, connectSource, dimmed, spotlight, demoActive, dropTarget, candidateSide, editMode, onMouseDown, onClick, onDoubleClick, onAnchorMouseDown }) {
  const base = TYPE_STYLE[node.type] || TYPE_STYLE.process;
  const s = node.color || base;
  const lines = wrapLines(node.text, node.w, 13);
  const lineH = 15;
  const startY = node.y + node.h / 2 - ((lines.length - 1) * lineH) / 2;
  const hasMeta = node.person || node.role;
  return (
    <g
      className="node-group"
      onMouseDown={onMouseDown}
      onClick={onClick}
      onDoubleClick={onDoubleClick}
      style={{ cursor: "grab", opacity: dimmed ? 0.22 : 1, transition: "opacity 0.15s" }}
    >
      <ShapeBody node={node} />
      {editMode && ["top", "right", "bottom", "left"].map((side) => {
        const [ax, ay] = anchorPoint(node, side);
        const isCandidate = candidateSide === side;
        return (
          <React.Fragment key={side}>
            <circle
              className="anchor-hit"
              cx={ax} cy={ay} r="13"
              pointerEvents="all"
              onMouseDown={(e) => { e.stopPropagation(); onAnchorMouseDown && onAnchorMouseDown(node.id, side, e); }}
            />
            <circle
              className={`anchor-dot${isCandidate ? " candidate" : ""}`}
              cx={ax} cy={ay} r="5.5"
              fill="#FFFFFF" stroke="#1868DB" strokeWidth="1.8"
              pointerEvents="none"
            />
          </React.Fragment>
        );
      })}
      {dropTarget && (
        <rect
          x={node.x - 6} y={node.y - 6} width={node.w + 12} height={node.h + 12}
          rx={11} fill="none" stroke="#1E9E5A" strokeWidth="3" strokeDasharray="3,4"
        />
      )}
      {selected && (
        <rect
          x={node.x - 5} y={node.y - 5} width={node.w + 10} height={node.h + 10}
          rx={10} fill="none" stroke="#1868DB" strokeWidth="2" strokeDasharray="4,3"
        />
      )}
      {connectSource === node.id && (
        <rect
          x={node.x - 5} y={node.y - 5} width={node.w + 10} height={node.h + 10}
          rx={10} fill="none" stroke="#B8850F" strokeWidth="3"
        />
      )}
      {spotlight && (
        <rect
          className={demoActive ? "demo-pulse" : ""}
          x={node.x - 7} y={node.y - 7} width={node.w + 14} height={node.h + 14}
          rx={12} fill="none" stroke={demoActive ? "#E0862F" : "#1E9E5A"} strokeWidth="3"
        />
      )}
      {lines.map((ln, i) => (
        <text
          key={i}
          x={node.x + node.w / 2}
          y={startY + i * lineH}
          textAnchor="middle"
          dominantBaseline="central"
          fontSize="13"
          fontWeight={node.type === "highlight" || node.type === "terminal" ? 700 : 600}
          fill={s.text}
          style={{ pointerEvents: "none", fontFamily: "Arial, sans-serif" }}
        >
          {ln}
        </text>
      ))}
      {node.status && node.status !== "Not started" && (
        <circle cx={node.x + node.w - 10} cy={node.y + 10} r={5} fill={STATUS_COLOR[node.status] || "#999"} stroke="#fff" strokeWidth="1" />
      )}
      {hasMeta && (
        <text
          x={node.x + node.w / 2}
          y={node.y + node.h + 13}
          textAnchor="middle"
          fontSize="10.5"
          fill="#5B6472"
          style={{ pointerEvents: "none", fontFamily: "Arial, sans-serif" }}
        >
          {"👤 " + (node.person ? node.person : node.role)}
        </text>
      )}
    </g>
  );
}

// ---------------- mini-map ----------------
function MiniMap({ nodes, pan, zoom, viewportEl, onNavigate }) {
  const mmW = 220, mmH = 150;
  const scale = Math.min(mmW / CANVAS_W, mmH / CANVAS_H);
  const rect = viewportEl ? viewportEl.getBoundingClientRect() : { width: 12000, height: 12000 };
  const viewX = -pan.x / zoom, viewY = -pan.y / zoom - TOP_PAD;
  const viewW = rect.width / zoom, viewH = rect.height / zoom;

  return (
    <div
      className="minimap"
      onClick={(e) => {
        const b = e.currentTarget.getBoundingClientRect();
        const clickX = (e.clientX - b.left) / scale;
        const clickY = (e.clientY - b.top) / scale;
        onNavigate(clickX, clickY);
      }}
      title="Click to jump to that area"
    >
      <svg width={mmW} height={mmH} viewBox={`0 0 ${mmW} ${mmH}`}>
        <rect x="0" y="0" width={mmW} height={mmH} fill="#F5F6F8" stroke="#E2E5EA" />
        {nodes.map((n) => {
          const s = TYPE_STYLE[n.type] || TYPE_STYLE.process;
          return (
            <rect
              key={n.id}
              x={n.x * scale} y={n.y * scale}
              width={Math.max(2, n.w * scale)} height={Math.max(2, n.h * scale)}
              fill={s.stroke} opacity="0.75"
            />
          );
        })}
        <rect
          x={viewX * scale} y={viewY * scale}
          width={Math.max(4, viewW * scale)} height={Math.max(4, viewH * scale)}
          fill="rgba(24,104,219,0.15)" stroke="#1868DB" strokeWidth="1.5"
        />
      </svg>
    </div>
  );
}
